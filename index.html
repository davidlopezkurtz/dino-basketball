      const COURTS = [

      const ASSET_DEFS = (window.DINO_ASSETS && window.DINO_ASSETS.images) || {};

      let width = 0;

      const loadedSave = loadSave();

      const game = {
        state: loadedSave.score >= CONFIG.FINAL_SCORE && !loadedSave.finaleSeen ? STATE.END : STATE.START,

        unlockedDinos: loadedSave.unlockedDinos,

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }

      function pick(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function easeOutCubic(t) {
        const n = clamp(t, 0, 1);
        return 1 - Math.pow(1 - n, 3);
      }

      function defaultSave() {
        return {
          version: SAVE_VERSION,
          score: 0,
          unlockedDinos: [DINOS[0].id],
          selectedDino: DINOS[0].id,
          court: COURTS[0].id,
          finaleSeen: false
        };
      }

      function validDinoIds() {
        return DINOS.map((dino) => dino.id);
      }

      function validCourtIds() {
        return COURTS.map((court) => court.id);
      }

      function getDinoById(id) {
        return DINOS.find((dino) => dino.id === id) || DINOS[0];
      }

      function getCourtById(id) {
        return COURTS.find((court) => court.id === id) || COURTS[0];
      }

      function getCurrentDino() {
        return getDinoById(game.selectedDino);
      }

      function getCurrentCourt() {
        return getCourtById(game.court);
      }

      function unlockedDinosForScore(score) {
        return DINOS.filter((dino) => score >= dino.unlockAt).map((dino) => dino.id);
      }

      function unlockedCourtsForScore(score) {
        return COURTS.filter((court) => score >= court.unlockAt).map((court) => court.id);
      }

      function normalizeSave(value) {
        const fallback = defaultSave();
        if (!value || typeof value !== "object") return fallback;

        const score = Math.max(0, Math.floor(Number(value.score) || 0));
        const finaleSeen = Boolean(value.finaleSeen) && score >= CONFIG.FINAL_SCORE;
        const validDinos = new Set(validDinoIds());
        const earnedDinos = new Set(unlockedDinosForScore(score));
        const storedDinos = Array.isArray(value.unlockedDinos) ? value.unlockedDinos : [];
        for (const id of storedDinos) {
          if (validDinos.has(id)) earnedDinos.add(id);
        }
        if (!earnedDinos.size) earnedDinos.add(DINOS[0].id);

        const unlockedDinos = [...earnedDinos].sort((a, b) => getDinoById(a).unlockAt - getDinoById(b).unlockAt);
        const selectedDino = unlockedDinos.includes(value.selectedDino) ? value.selectedDino : unlockedDinos[0];
        const unlockedCourts = unlockedCourtsForScore(score);
        const court = validCourtIds().includes(value.court) && unlockedCourts.includes(value.court)
          ? value.court
          : unlockedCourts[unlockedCourts.length - 1] || COURTS[0].id;

        return {
          version: SAVE_VERSION,
          score,
          unlockedDinos,
          selectedDino,
          court,
          finaleSeen
        };
      }

      function loadSave() {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.has("reset")) {
            localStorage.removeItem(SAVE_KEY);
            params.delete("reset");
            const query = params.toString();
            const cleanUrl = window.location.pathname + (query ? `?${query}` : "") + window.location.hash;
            window.history.replaceState(null, "", cleanUrl);
            return defaultSave();
          }
          const raw = localStorage.getItem(SAVE_KEY);
          return normalizeSave(raw ? JSON.parse(raw) : null);
        } catch (error) {
          return defaultSave();
        }
      }

      function saveGame() {
        try {
          const payload = {
            version: SAVE_VERSION,
            score: game.score,
            unlockedDinos: game.unlockedDinos,
            selectedDino: game.selectedDino,
            court: game.court,
            finaleSeen: game.finaleSeen
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
        } catch (error) {
          // localStorage can be unavailable in private modes. The game still plays.
        }
      }

      function versionedAssetSrc(src) {
        const separator = src.includes("?") ? "&" : "?";
        return `${src}${separator}v=${encodeURIComponent(ASSET_VERSION)}`;
      }

      function loadAssets() {
        const entries = Object.entries(ASSET_DEFS);
        if (!entries.length) {
          assets.ready = true;
          return Promise.resolve();
        }

        return Promise.all(entries.map(([id, def]) => new Promise((resolve) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => {
            assets.images[id] = { ...def, image, loaded: true };
            assets.loaded += 1;
            resolve();
          };
          image.onerror = () => {
            assets.failed += 1;
            resolve();
          };
          image.src = versionedAssetSrc(def.src);
        }))).then(() => {
          assets.ready = true;
        });
      }

      function getAsset(id) {
        if (!assets.ready) return null;
        const asset = assets.images[id];
        return asset && asset.loaded ? asset : null;
      }

      function getPoseForMood(mood, happyActive) {
        if (mood === "launch") return "launch";
        if (mood === "shrug") return "shrug";
        if (happyActive) return "happy";
        return "idle";
      }

      function getDinoSpriteChoice(dino, pose) {
        const specificId = `dino.${dino.id}.${pose}`;
        if (getAsset(specificId)) return { id: specificId, specific: true };
        return { id: `dino.${pose}`, specific: false };
      }

      function drawSprite(assetId, x, y, logicalWidth, options = {}) {
        const asset = getAsset(assetId);
        if (!asset || logicalWidth <= 0) return false;

        const anchorX = options.anchorX ?? asset.anchorX ?? 0.5;
        const anchorY = options.anchorY ?? asset.anchorY ?? 0.5;
        const logicalHeight = options.logicalHeight ?? logicalWidth * (asset.height / asset.width);
        const alpha = options.alpha ?? 1;
        const scaleX = options.scaleX ?? 1;
        const scaleY = options.scaleY ?? 1;
        const rotation = options.rotation ?? 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.globalAlpha *= alpha;
        ctx.scale(scaleX, scaleY);
        ctx.drawImage(
          asset.image,
          -logicalWidth * anchorX,
          -logicalHeight * anchorY,
          logicalWidth,
          logicalHeight
        );
        ctx.restore();
        return true;
      }

      function drawCoverImage(assetId, focusX = 0.5, focusY = 0.5) {
        const asset = getAsset(assetId);
        if (!asset) return false;

        const scale = Math.max(width / asset.width, height / asset.height);
        const drawW = asset.width * scale;
        const drawH = asset.height * scale;
        const x = (width - drawW) * focusX;
        const y = (height - drawH) * focusY;
        ctx.drawImage(asset.image, x, y, drawW, drawH);
        return true;
      }

      function getViewportSize() {
        const viewport = window.visualViewport;
        return {
          w: Math.max(1, Math.round(viewport ? viewport.width : window.innerWidth)),
          h: Math.max(1, Math.round(viewport ? viewport.height : window.innerHeight))
        };
      }

      function readSafeInset(name) {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(name);
        const value = parseFloat(raw);
        return Number.isFinite(value) ? value : 0;
      }

      function safeInsets() {
        return {
          top: readSafeInset("--safe-top"),
          right: readSafeInset("--safe-right"),
          bottom: readSafeInset("--safe-bottom"),
          left: readSafeInset("--safe-left")
        };
      }

      function resizeCanvas() {
        const size = getViewportSize();
        width = size.w;
        height = size.h;
        dpr = clamp(window.devicePixelRatio || 1, 1, 3);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        resetReadyBall();
      }

      function getLayout() {
        const safe = safeInsets();
        const minSide = Math.min(width, height);
        const bottomPad = clamp(height * 0.11, 48, 96) + safe.bottom * 0.35;
        const groundY = height - bottomPad;
        const dinoSize = clamp(minSide * 0.19, 62, 96);
        const dinoX = width < height ? width * 0.24 : width * 0.18;
        const hoopX = width < height ? width * 0.76 : width * 0.72;
        const hoopY = clamp(height * 0.29, 108 + safe.top * 0.25, groundY - dinoSize * 1.8);
        const rimR = clamp(minSide * 0.055, 21, 34);
        const ballR = clamp(minSide * 0.035, 13, 21);
        return {
          safe,
          minSide,
          groundY,
          dino: { x: dinoX, y: groundY, size: dinoSize },
          hand: { x: dinoX + dinoSize * 0.38, y: groundY - dinoSize * 0.57 },
          hoop: {
            x: hoopX,
            y: hoopY,
            rimR,
            sensorR: rimR * CONFIG.SCORE_SENSOR_SCALE,
            poleX: hoopX + rimR * 1.6
          },
          ballR
        };
      }

      function resetReadyBall() {
        if (!width || !height || game.ball.state !== "ready") return;
        const layout = getLayout();
        game.ball.x = layout.hand.x;
        game.ball.y = layout.hand.y;
        game.ball.r = layout.ballR;
        game.ball.vx = 0;
        game.ball.vy = 0;
        game.ball.age = 0;
        game.ball.scored = false;
        game.ball.afterScore = 0;
        game.ball.squeeze = 0;
        game.ball.shotKind = "normal";
        game.ball.profile = null;
        game.ball.gravityScale = 1;
        game.ball.magnetism = CONFIG.BALL_MAGNETISM;
        game.ball.power = false;
        game.ball.companions = null;
        game.ball.bounceArmed = false;
        game.ball.trail.length = 0;
      }

      function ensureAudio() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        if (!audioContext) {
          audioContext = new AudioCtor();
        }
        if (audioContext.state !== "running") {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      }

      function makeNoiseBuffer(ctxRef) {
        if (noiseBuffer) return noiseBuffer;
        const length = Math.floor(ctxRef.sampleRate * 0.28);
        const buffer = ctxRef.createBuffer(1, length, ctxRef.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          const fade = 1 - i / length;
          data[i] = (Math.random() * 2 - 1) * fade;
        }
        noiseBuffer = buffer;
        return buffer;
      }

      function playTone({ type = "sine", start = 440, end = 440, duration = 0.12, gain = 0.08 }) {
        const ctxRef = ensureAudio();
        if (!ctxRef) return;
        const now = ctxRef.currentTime;
        const osc = ctxRef.createOscillator();
        const amp = ctxRef.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(start * rand(0.96, 1.04), now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, end * rand(0.96, 1.04)), now + duration);
        amp.gain.setValueAtTime(0.0001, now);
        amp.gain.exponentialRampToValueAtTime(gain, now + 0.012);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(amp).connect(ctxRef.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      function playTap() {
        playTone({ type: "triangle", start: 260, end: 410, duration: 0.08, gain: 0.045 });
      }

      function playMiss() {
        playTone({ type: "sine", start: 240, end: 150, duration: 0.18, gain: 0.035 });
      }

      function playSwish() {
        const ctxRef = ensureAudio();
        if (!ctxRef) return;
        const now = ctxRef.currentTime;
        const source = ctxRef.createBufferSource();
        const filter = ctxRef.createBiquadFilter();
        const amp = ctxRef.createGain();
        source.buffer = makeNoiseBuffer(ctxRef);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(2400, now + 0.18);
        filter.Q.setValueAtTime(1.2, now);
        amp.gain.setValueAtTime(0.0001, now);
        amp.gain.exponentialRampToValueAtTime(0.06, now + 0.025);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        source.connect(filter).connect(amp).connect(ctxRef.destination);
        source.start(now);
        source.stop(now + 0.24);
        playTone({ type: "sine", start: 660, end: 920, duration: 0.12, gain: 0.025 });
      }

      function playDinoCheer(dino) {
        const pitch = dino.fanfare || 1;
        window.setTimeout(() => {
          playTone({ type: "square", start: 160 * pitch, end: 115 * pitch, duration: 0.11, gain: 0.024 });
        }, 80);
      }

      function playFanfare(dino) {
        const pitch = dino.fanfare || 1;
        playTone({ type: "triangle", start: 392 * pitch, end: 523 * pitch, duration: 0.16, gain: 0.06 });
        window.setTimeout(() => playTone({ type: "triangle", start: 523 * pitch, end: 659 * pitch, duration: 0.16, gain: 0.06 }), 135);
        window.setTimeout(() => playTone({ type: "sine", start: 659 * pitch, end: 988 * pitch, duration: 0.28, gain: 0.075 }), 275);
        window.setTimeout(() => playDinoCheer(dino), 520);
      }

      function speakDinoName(dino) {
        if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        try {
          const utterance = new SpeechSynthesisUtterance(dino.name || dino.id);
          utterance.rate = 0.86;
          utterance.pitch = 1.25;
          utterance.volume = 0.78;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utterance);
        } catch (error) {
          // Speech support varies by browser. The visual name reveal remains the fallback.
        }
      }

      function getCourtJuice(courtId = game.court) {
        if (courtId === "beach") {
          return { palette: ["#38bdf8", "#fef3c7", "#fb7185", "#facc15"], shape: "shell" };
        }
        if (courtId === "volcano") {
          return { palette: ["#fb923c", "#f97316", "#fef08a", "#ef4444"], shape: "spark" };
        }
        if (courtId === "space") {
          return { palette: ["#c4b5fd", "#93c5fd", "#fef08a", "#f0abfc"], shape: "planet" };
        }
        if (courtId === "ice") {
          return { palette: ["#bae6fd", "#67e8f9", "#ffffff", "#93c5fd"], shape: "spark" };
        }
        if (courtId === "desert") {
          return { palette: ["#fbbf24", "#fed7aa", "#fb923c", "#fef3c7"], shape: "stomp" };
        }
        if (courtId === "candy") {
          return { palette: ["#f9a8d4", "#f0abfc", "#fef08a", "#93c5fd"], shape: "star" };
        }
        if (courtId === "city") {
          return { palette: ["#94a3b8", "#facc15", "#60a5fa", "#ffffff"], shape: "spark" };
        }
        if (courtId === "moon") {
          return { palette: ["#c4b5fd", "#e0e7ff", "#fef08a", "#a5b4fc"], shape: "planet" };
        }
        if (courtId === "rainbow") {
          return { palette: ["#fb7185", "#facc15", "#22c55e", "#60a5fa", "#f0abfc"], shape: "star" };
        }
        return { palette: ["#86efac", "#fef08a", "#22c55e", "#38bdf8"], shape: "leaf" };
      }

      function chooseShotKind() {
        if (game.nextShotKind) {
          const forced = game.nextShotKind;
          game.nextShotKind = null;
          return forced;
        }

        if (game.shotCount > 0 && game.shotCount % CONFIG.SPECIAL_SHOT_INTERVAL === 0) {
          return SPECIAL_SHOTS[(Math.floor(game.shotCount / CONFIG.SPECIAL_SHOT_INTERVAL) - 1) % SPECIAL_SHOTS.length];
        }

        return "normal";
      }

      function createShotProfile(kind, dino, isPower) {
        const profile = {
          kind,
          isPower,
          guaranteedMake: Boolean(isPower),
          flightScale: 1,
          gravityScale: 1,
          magnetism: CONFIG.BALL_MAGNETISM,
          targetLift: 0,
          targetSide: 0,
          companions: null,
          bounceAt: 0,
          makeShape: "star"
        };

        if (kind === "moon") {
          profile.flightScale = 1.16;
          profile.gravityScale = 0.9;
          profile.targetLift = -10;
        } else if (kind === "dunk") {
          profile.flightScale = 0.82;
          profile.gravityScale = 1.08;
          profile.magnetism = 0.26;
        } else if (kind === "bank") {
          profile.flightScale = 0.9;
          profile.targetSide = 12;
          profile.magnetism = 0.23;
          profile.makeShape = "spark";
        } else if (kind === "star") {
          profile.magnetism = 0.28;
        } else if (kind === "rainbow") {
          profile.flightScale = 1.08;
          profile.targetLift = -8;
        }

        if (!isPower) return profile;

        profile.makeShape = dino.powerIcon === "splash" ? "shell" : dino.powerIcon === "pinball" ? "spark" : "star";
        if (dino.power === "stompDunk") {
          profile.kind = "dunk";
          profile.flightScale = 0.7;
          profile.gravityScale = 1.14;
          profile.magnetism = 0.34;
        } else if (dino.power === "tripleShot") {
          profile.kind = "triple";
          profile.companions = [{ dx: -18, dy: 14, delay: 0.09 }, { dx: 18, dy: 14, delay: 0.15 }];
          profile.magnetism = 0.3;
        } else if (dino.power === "starShield") {
          profile.kind = "star";
          profile.flightScale = 1.02;
          profile.magnetism = 0.38;
        } else if (dino.power === "floatShot") {
          profile.kind = "moon";
          profile.flightScale = 1.28;
          profile.gravityScale = 0.82;
          profile.magnetism = 0.32;
        } else if (dino.power === "zoomShot") {
          profile.kind = "bank";
          profile.flightScale = 0.68;
          profile.gravityScale = 1.12;
          profile.magnetism = 0.3;
        } else if (dino.power === "splashShot") {
          profile.kind = "splash";
          profile.flightScale = 1.02;
          profile.magnetism = 0.36;
        } else if (dino.power === "bounceShot") {
          profile.kind = "bounce";
          profile.flightScale = 1.06;
          profile.bounceAt = 0.52;
          profile.magnetism = 0.34;
        } else if (dino.power === "pinballRoll") {
          profile.kind = "pinball";
          profile.flightScale = 1.04;
          profile.magnetism = 0.4;
          profile.targetSide = -10;
        } else if (dino.power === "skyLob") {
          profile.kind = "rainbow";
          profile.flightScale = 1.34;
          profile.gravityScale = 0.88;
          profile.targetLift = -22;
          profile.magnetism = 0.34;
        } else if (dino.power === "musicEcho") {
          profile.kind = "music";
          profile.flightScale = 1.05;
          profile.companions = [{ dx: -14, dy: 8, delay: 0.12 }, { dx: -28, dy: 16, delay: 0.24 }];
          profile.magnetism = 0.34;
        }

        return profile;
      }

      function startPowerMove(dino) {
        game.powerMove = {
          type: dino.power,
          dinoId: dino.id,
          time: 0,
          duration: CONFIG.POWER_MOVE_SECONDS
        };
      }

      function launchShot(options = {}) {
        if (game.score >= CONFIG.FINAL_SCORE && !game.finaleSeen) {
          startEndCelebration();
          return;
        }
        const ball = game.ball;
        if (ball.state !== "ready") {
          if (options.power) game.queuedPower = true;
          else game.queuedShot = true;
          playTap();
          return;
        }

        const dino = getCurrentDino();
        const isPower = Boolean(options.power);
        if (isPower && game.powerCharge <= 0) {
          game.powerBounce = CONFIG.POWER_BUTTON_BOUNCE_MS / 1000;
          spawnParticles(width - 56, height - 62, 10, dino.particles, "star");
          playTap();
          return;
        }
        if (isPower) {
          game.powerCharge = 0;
          game.powerMeter = 0;
          game.powerFlash = 0;
          startPowerMove(dino);
        }

        const layout = getLayout();
        const hoop = layout.hoop;
        const startX = layout.hand.x;
        const startY = layout.hand.y;
        game.shotCount += 1;
        const baseKind = isPower ? dino.power : chooseShotKind();
        const profile = createShotProfile(baseKind, dino, isPower);
        const shotKind = profile.kind;
        const willMake = profile.guaranteedMake || Math.random() < CONFIG.MAKE_RATE;
        const assistedScatter = CONFIG.MISS_WOBBLE * (1 - CONFIG.AIM_ASSIST + 0.18);
        let targetX = hoop.x + profile.targetSide + rand(-assistedScatter, assistedScatter);
        let targetY = hoop.y + profile.targetLift + rand(-assistedScatter * 0.55, assistedScatter * 0.55);

        if (!willMake) {
          const missSide = Math.random() < 0.5 ? -1 : 1;
          targetX = hoop.x + missSide * hoop.sensorR * rand(1.15, 1.45);
          targetY = hoop.y + rand(-hoop.rimR * 0.9, hoop.rimR * 0.65);
        }

        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.hypot(dx, dy);
        const flightTime = clamp(distance / (520 * CONFIG.SHOT_POWER), 0.78, 1.08) * profile.flightScale;
        const gravity = CONFIG.GRAVITY * profile.gravityScale;

        ball.state = "flying";
        ball.x = startX;
        ball.y = startY;
        ball.r = layout.ballR;
        ball.vx = dx / flightTime;
        ball.vy = (dy - 0.5 * gravity * flightTime * flightTime) / flightTime;
        ball.age = 0;
        ball.flightTime = flightTime;
        ball.intent = willMake ? "make" : "miss";
        ball.scored = false;
        ball.afterScore = 0;
        ball.squeeze = 1;
        ball.shotKind = shotKind;
        ball.profile = profile;
        ball.gravityScale = profile.gravityScale;
        ball.magnetism = profile.magnetism;
        ball.power = isPower;
        ball.companions = profile.companions;
        ball.bounceArmed = Boolean(profile.bounceAt);
        ball.trail.length = 0;

        game.dinoReact = 0.18;
        game.dinoMood = "launch";
        playTap();
        if (isPower) {
          game.shakeLeft = Math.max(game.shakeLeft, 0.08);
          spawnParticles(startX, startY, 18, dino.powerPalette || dino.particles, profile.makeShape);
        }
      }

      function handleProgressionAfterScore() {
        const previousDinos = new Set(game.unlockedDinos);
        const earnedDinos = unlockedDinosForScore(game.score);
        let newlyUnlockedDino = null;

        for (const id of earnedDinos) {
          if (!previousDinos.has(id)) {
            newlyUnlockedDino = id;
            break;
          }
        }

        game.unlockedDinos = earnedDinos;
        if (newlyUnlockedDino) {
          game.pendingHatchDino = newlyUnlockedDino;
        }

        const courtsBefore = unlockedCourtsForScore(Math.max(0, game.score - 1));
        const courtsNow = unlockedCourtsForScore(game.score);
        if (courtsNow.length > courtsBefore.length) {
          game.court = courtsNow[courtsNow.length - 1];
          game.courtFlash = CONFIG.COURT_FLASH_SECONDS;
          const juice = getCourtJuice(game.court);
          spawnParticles(width * 0.5, height * 0.34, Math.floor(CONFIG.PARTICLE_COUNT * 0.8), juice.palette, juice.shape);
        }

        saveGame();
      }

      function startHatch(dinoId) {
        const dino = getDinoById(dinoId);
        game.state = STATE.HATCH;
        game.hatch = {
          time: 0,
          revealTime: 0,
          duration: CONFIG.HATCH_SECONDS,
          dinoId,
          taps: 0,
          revealed: false
        };
        game.queuedShot = false;
        game.queuedPower = false;
        game.autoLaunchDelay = 0;
        game.autoLaunchPower = false;
        game.ball.state = "ready";
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        spawnParticles(width * 0.5, height * 0.47, Math.floor(CONFIG.PARTICLE_COUNT * 0.45), dino.particles, "star");
      }

      function endHatch() {
        if (game.hatch && game.hatch.dinoId) {
          game.selectedDino = game.hatch.dinoId;
          saveGame();
        }
        game.state = STATE.PLAY;
        game.hatch = null;
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        resetReadyBall();
        if (game.pendingEnd) startEndCelebration();
      }

      function startEndCelebration() {
        const dino = getCurrentDino();
        game.state = STATE.END;
        game.end = { time: 0 };
        game.pendingEnd = false;
        game.pendingHatchDino = null;
        game.hatch = null;
        game.surprise = null;
        game.dinoCelebration = null;
        game.powerMove = null;
        game.queuedShot = false;
        game.queuedPower = false;
        game.autoLaunchDelay = 0;
        game.autoLaunchPower = false;
        game.ball.state = "ready";
        game.dinoReact = 0.9;
        game.dinoMood = "happy";
        game.shakeLeft = Math.max(game.shakeLeft, CONFIG.SHAKE_MS / 1000);
        const courtJuice = getCourtJuice();
        spawnParticles(width * 0.5, height * 0.33, CONFIG.PARTICLE_COUNT + 42, courtJuice.palette, courtJuice.shape);
        spawnParticles(width * 0.5, height * 0.42, CONFIG.PARTICLE_COUNT, dino.particles, "star");
        playFanfare(dino);
      }

      function restartRound() {
        const fresh = defaultSave();
        game.score = fresh.score;
        game.unlockedDinos = fresh.unlockedDinos.slice();
        game.selectedDino = fresh.selectedDino;
        game.court = fresh.court;
        game.finaleSeen = fresh.finaleSeen;
        game.streak = 0;
        game.pendingHatchDino = null;
        game.pendingEnd = false;
        game.powerCharge = 0;
        game.powerMeter = 0;
        game.powerBounce = 0;
        game.powerFlash = 0;
        game.powerMove = null;
        game.resetHold = null;
        game.hatch = null;
        game.end = null;
        game.courtFlash = 0;
        game.shotCount = 0;
        game.nextShotKind = null;
        game.nextSurpriseAt = randomInt(CONFIG.SURPRISE_MIN_BASKETS, CONFIG.SURPRISE_MAX_BASKETS);
        game.surprise = null;
        game.dinoCelebration = null;
        game.hoopSparkle = 0;
        game.pickerBounce = 0;
        game.queuedShot = false;
        game.queuedPower = false;
        game.autoLaunchDelay = 0;
        game.autoLaunchPower = false;
        game.ball.state = "ready";
        game.dinoReact = 0.4;
        game.dinoMood = "happy";
        saveGame();
        resetReadyBall();
      }

      function cycleCourt() {
        const unlocked = unlockedCourtsForScore(game.score);
        if (unlocked.length < 2) return;
        const currentIndex = Math.max(0, unlocked.indexOf(game.court));
        game.court = unlocked[(currentIndex + 1) % unlocked.length];
        game.courtFlash = CONFIG.COURT_FLASH_SECONDS * 0.8;
        const juice = getCourtJuice(game.court);
        spawnParticles(width * 0.5, height * 0.32, Math.floor(CONFIG.PARTICLE_COUNT * 0.55), juice.palette, juice.shape);
        saveGame();
      }

      function startSurprise(type = pick(SURPRISE_TYPES)) {
        game.surprise = {
          type,
          time: 0,
          duration: type === "parade" ? 3.8 : 2.8
        };
        if (type === "starBall") game.nextShotKind = "star";
        if (type === "sparkleHoop") game.hoopSparkle = 2.8;
      }

      function maybeStartSurprise(layout) {
        if (game.score < game.nextSurpriseAt) return;
        const type = pick(SURPRISE_TYPES);
        game.nextSurpriseAt = game.score + randomInt(CONFIG.SURPRISE_MIN_BASKETS, CONFIG.SURPRISE_MAX_BASKETS);
        startSurprise(type);
        const juice = getCourtJuice();
        spawnParticles(width * 0.5, height * 0.22, CONFIG.PARTICLE_COUNT, juice.palette, juice.shape);
        if (type === "confettiRain") {
          for (let i = 0; i < 18; i += 1) {
            spawnParticles(rand(width * 0.12, width * 0.88), rand(20, height * 0.22), 2, juice.palette, juice.shape);
          }
        }
        if (type === "parade") {
          spawnParticles(layout.dino.x, layout.dino.y - layout.dino.size * 0.8, CONFIG.PARTICLE_COUNT, juice.palette, juice.shape);
        }
      }

      function triggerDinoPersonality(dino, layout) {
        game.dinoCelebration = {
          type: dino.id,
          time: 0,
          duration: 1.1
        };
        if (dino.id === "trex") {
          spawnParticles(layout.dino.x, layout.dino.y - 8, 18, ["#fde68a", "#d9f99d", "#f97316"], "stomp");
        } else if (dino.id === "trike") {
          spawnParticles(layout.dino.x + layout.dino.size * 0.45, layout.dino.y - layout.dino.size * 0.85, 22, dino.particles, "spark");
        } else if (dino.id === "stego") {
          spawnParticles(layout.dino.x - layout.dino.size * 0.35, layout.dino.y - layout.dino.size * 0.48, 24, dino.particles, "star");
        } else if (dino.id === "ptero") {
          spawnParticles(layout.dino.x, layout.dino.y - layout.dino.size * 1.05, 28, dino.particles, "planet");
        } else {
          spawnParticles(layout.dino.x, layout.dino.y - layout.dino.size * 0.72, 22, dino.particles, dino.powerIcon === "splash" ? "shell" : dino.powerIcon === "pinball" ? "spark" : "star");
        }
      }

      function scoreBasket(forceCenter) {
        const ball = game.ball;
        if (ball.scored) return;
        const layout = getLayout();
        if (forceCenter) {
          ball.x = layout.hoop.x;
          ball.y = layout.hoop.y + layout.hoop.rimR * 0.12;
        }
        ball.scored = true;
        ball.intent = "scored";
        ball.afterScore = 0;
        ball.vx = rand(-35, 35);
        ball.vy = 420;
        ball.squeeze = 1;
        game.score += 1;
        game.streak += 1;
        if (game.powerCharge < 1) {
          game.powerMeter += 1;
          if (game.powerMeter >= CONFIG.POWER_CHARGE_MAKES) {
            game.powerCharge = 1;
            game.powerMeter = 0;
            game.powerFlash = 1.2;
          }
        }
        if (game.score >= CONFIG.FINAL_SCORE && !game.finaleSeen) {
          game.pendingEnd = true;
          game.queuedShot = false;
          game.queuedPower = false;
        }
        game.shakeLeft = CONFIG.SHAKE_MS / 1000;
        game.rimWobble = 1;
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        const dino = getCurrentDino();
        const courtJuice = getCourtJuice();
        const shotBonus = ball.shotKind === "normal" ? 0 : 16;
        const powerBonus = ball.power ? 22 : 0;
        spawnParticles(layout.hoop.x, layout.hoop.y, CONFIG.PARTICLE_COUNT + Math.min(game.streak, 6) * 3 + shotBonus, courtJuice.palette, courtJuice.shape);
        spawnParticles(layout.hoop.x, layout.hoop.y, 14 + powerBonus, ball.power ? dino.powerPalette || dino.particles : dino.particles, ball.profile ? ball.profile.makeShape : ball.shotKind === "bank" ? "spark" : "star");
        if (game.streak === 3 || game.streak === 5 || game.streak % 10 === 0) {
          game.hoopSparkle = Math.max(game.hoopSparkle, 1.4);
          spawnParticles(layout.hoop.x, layout.hoop.y - layout.hoop.rimR, CONFIG.PARTICLE_COUNT + game.streak, COLORS, "star");
          playTone({ type: "triangle", start: 740 + Math.min(game.streak, 12) * 18, end: 980 + Math.min(game.streak, 12) * 20, duration: 0.12, gain: 0.035 });
        }
        if (ball.shotKind === "bank") game.hoopSparkle = 1.2;
        if (ball.shotKind === "dunk") game.shakeLeft = Math.max(game.shakeLeft, 0.28);
        playSwish();
        playDinoCheer(dino);
        triggerDinoPersonality(dino, layout);
        maybeStartSurprise(layout);
        handleProgressionAfterScore();
      }

      function finishMiss() {
        const ball = game.ball;
        if (ball.state === "ready") return;
        ball.state = "ready";
        ball.scored = false;
        ball.squeeze = 1;
        game.streak = 0;
        game.dinoReact = 0.34;
        game.dinoMood = "shrug";
        playMiss();
        resetReadyBall();
        if (game.queuedPower) {
          game.queuedPower = false;
          game.autoLaunchPower = true;
          game.autoLaunchDelay = 0.08;
        } else if (game.queuedShot) {
          game.queuedShot = false;
          game.autoLaunchDelay = 0.08;
        }
      }

      function finishMake() {
        const ball = game.ball;
        ball.state = "ready";
        if (game.pendingHatchDino) {
          const dinoId = game.pendingHatchDino;
          game.pendingHatchDino = null;
          startHatch(dinoId);
          return;
        }
        if (game.pendingEnd || (game.score >= CONFIG.FINAL_SCORE && !game.finaleSeen)) {
          startEndCelebration();
          return;
        }
        resetReadyBall();
        if (game.queuedPower) {
          game.queuedPower = false;
          game.autoLaunchPower = true;
          game.autoLaunchDelay = 0.08;
        } else if (game.queuedShot) {
          game.queuedShot = false;
          game.autoLaunchDelay = 0.08;
        }
      }

      function spawnParticles(x, y, count, palette = null, shape = null) {
        const colors = palette && palette.length ? palette : COLORS;
        for (let i = 0; i < count; i += 1) {
          const p = game.particlePool.pop() || {};
          const angle = rand(-Math.PI, 0);
          const speed = rand(120, 430);
          p.x = x;
          p.y = y;
          p.vx = Math.cos(angle) * speed + rand(-60, 60);
          p.vy = Math.sin(angle) * speed - rand(20, 140);
          p.life = rand(0.55, 1.05);
          p.maxLife = p.life;
          p.size = rand(4, 9);
          p.spin = rand(-7, 7);
          p.rot = rand(0, TAU);
          p.color = colors[(Math.random() * colors.length) | 0];
          p.shape = shape || (Math.random() < 0.35 ? "star" : "confetti");
          game.particles.push(p);
        }
      }

      function updateParticles(dt) {
        for (let i = game.particles.length - 1; i >= 0; i -= 1) {
          const p = game.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            game.particles.splice(i, 1);
            game.particlePool.push(p);
            continue;
          }
          p.vy += CONFIG.GRAVITY * 0.38 * dt;
          p.vx *= 0.992;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.spin * dt;
        }
      }

      function updateBall(dt) {
        const ball = game.ball;
        const layout = getLayout();
        if (ball.state === "ready") {
          ball.r = layout.ballR;
          ball.x = layout.hand.x;
          ball.y = layout.hand.y + Math.sin(game.time * 4.5) * 2;
          ball.squeeze = Math.max(0, ball.squeeze - dt * 8);
          return;
        }

        ball.age += dt;
        ball.squeeze = Math.max(0, ball.squeeze - dt * 7);

        if (!ball.scored) {
          const hoop = layout.hoop;
          const dx = hoop.x - ball.x;
          const dy = hoop.y - ball.y;
          const dist = Math.hypot(dx, dy);
          if (ball.intent === "make" && ball.age > ball.flightTime * 0.42 && dist < hoop.sensorR * 3.2) {
            const pull = (ball.magnetism || CONFIG.BALL_MAGNETISM) * dt * 16;
            ball.vx += dx * pull;
            ball.vy += dy * pull;
          }
        }

        ball.vy += CONFIG.GRAVITY * (ball.gravityScale || 1) * dt;
        if (ball.shotKind !== "normal") {
          ball.trail.push({ x: ball.x, y: ball.y, age: 0, kind: ball.shotKind });
          if (ball.trail.length > 28) ball.trail.shift();
        }
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        for (const point of ball.trail) point.age += dt;

        const hoop = layout.hoop;
        if (!ball.scored && ball.shotKind === "pinball" && ball.intent === "make" && ball.age > ball.flightTime * 0.74) {
          const orbit = clamp((ball.age - ball.flightTime * 0.74) / (ball.flightTime * 0.24), 0, 1);
          const angle = orbit * TAU * 1.45 + game.time * 0.6;
          const radius = hoop.rimR * (2.55 - orbit * 1.35);
          ball.x = hoop.x + Math.cos(angle) * radius;
          ball.y = hoop.y + Math.sin(angle) * hoop.rimR * 0.5;
          ball.vx *= 0.82;
          ball.vy *= 0.82;
        }

        if (ball.bounceArmed && ball.profile && ball.profile.bounceAt && ball.age >= ball.flightTime * ball.profile.bounceAt) {
          ball.bounceArmed = false;
          ball.squeeze = 1;
          ball.vy = -Math.abs(ball.vy) * 0.42;
          spawnParticles(ball.x, Math.min(layout.groundY - ball.r, ball.y + ball.r * 0.8), 18, getCurrentDino().powerPalette || getCurrentDino().particles, "stomp");
          playTap();
        }

        const sensorDist = Math.hypot(ball.x - hoop.x, ball.y - hoop.y);
        const canSensorScore = ball.shotKind !== "pinball" || ball.age >= ball.flightTime * 0.9;
        if (!ball.scored && ((canSensorScore && sensorDist <= hoop.sensorR) || (ball.intent === "make" && ball.age >= ball.flightTime * 0.98))) {
          scoreBasket(ball.intent === "make");
        }

        if (ball.scored) {
          ball.afterScore += dt;
          if (ball.y > layout.groundY - ball.r) {
            ball.y = layout.groundY - ball.r;
            ball.vy = -Math.abs(ball.vy) * 0.32;
            ball.vx *= 0.7;
            ball.squeeze = 1;
          }
          if (ball.afterScore > 0.62) finishMake();
          return;
        }

        if (ball.y > layout.groundY - ball.r || ball.x < -ball.r * 3 || ball.x > width + ball.r * 3) {
          finishMiss();
        }
      }

      function update(dt) {
        game.time += dt;
        game.shakeLeft = Math.max(0, game.shakeLeft - dt);
        game.rimWobble = Math.max(0, game.rimWobble - dt * 4.2);
        game.dinoReact = Math.max(0, game.dinoReact - dt);
        game.courtFlash = Math.max(0, game.courtFlash - dt);
        game.hoopSparkle = Math.max(0, game.hoopSparkle - dt);
        game.pickerBounce = Math.max(0, game.pickerBounce - dt);
        game.powerBounce = Math.max(0, game.powerBounce - dt);
        game.powerFlash = Math.max(0, game.powerFlash - dt);
        if (game.powerMove) {
          game.powerMove.time += dt;
          if (Math.random() < dt * 9) {
            const dino = getDinoById(game.powerMove.dinoId);
            const layout = getLayout();
            const motion = getPowerDinoMotion(layout);
            spawnParticles(layout.dino.x + motion.dx, layout.dino.y + motion.dy - layout.dino.size * 0.72, 2, dino.powerPalette || dino.particles, dino.powerIcon === "splash" ? "shell" : dino.powerIcon === "pinball" ? "spark" : "star");
          }
          if (game.powerMove.time >= game.powerMove.duration) game.powerMove = null;
        }
        if (game.resetHold && game.resetHold.active) {
          game.resetHold.time += dt;
          if (game.resetHold.time >= CONFIG.PARENT_HOLD_SECONDS) {
            restartRound();
            game.state = STATE.START;
            game.resetHold = null;
            playFanfare(getCurrentDino());
          }
        }
        if (game.dinoCelebration) {
          game.dinoCelebration.time += dt;
          if (game.dinoCelebration.time >= game.dinoCelebration.duration) game.dinoCelebration = null;
        }
        if (game.surprise) {
          game.surprise.time += dt;
          if (game.surprise.type === "confettiRain" && Math.random() < dt * 7) {
            const juice = getCourtJuice();
            spawnParticles(rand(width * 0.1, width * 0.9), rand(16, height * 0.18), 3, juice.palette, juice.shape);
          }
          if (game.surprise.time >= game.surprise.duration) game.surprise = null;
        }
        updateParticles(dt);

        if (game.state === STATE.PLAY) {
          if (game.autoLaunchDelay > 0) {
            game.autoLaunchDelay -= dt;
            if (game.autoLaunchDelay <= 0) {
              const usePower = game.autoLaunchPower;
              game.autoLaunchPower = false;
              launchShot({ power: usePower });
            }
          }
          updateBall(dt);
        } else if (game.state === STATE.HATCH && game.hatch) {
          game.hatch.time += dt;
          if (game.hatch.revealed) game.hatch.revealTime += dt;
        } else if (game.state === STATE.END && game.end) {
          game.end.time += dt;
          if (Math.random() < dt * 2.2) {
            const juice = getCourtJuice();
            spawnParticles(rand(width * 0.15, width * 0.85), rand(height * 0.12, height * 0.4), 3, juice.palette, juice.shape);
          }
        }
      }

      function roundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function fillRoundedRect(x, y, w, h, r, color) {
        ctx.fillStyle = color;
        roundedRect(x, y, w, h, r);
        ctx.fill();
      }

      function drawProceduralBackground(layout) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#7dd3fc");
        sky.addColorStop(0.6, "#b9f3ff");
        sky.addColorStop(1, "#d9f99d");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#ffe66d";
        ctx.beginPath();
        ctx.arc(width * 0.16, height * 0.14, clamp(layout.minSide * 0.09, 34, 64), 0, TAU);
        ctx.fill();

        drawCloud(width * 0.64, height * 0.15, layout.minSide * 0.08, 0.72);
        drawCloud(width * 0.28, height * 0.25, layout.minSide * 0.07, 0.5);

        const groundY = layout.groundY;
        ctx.fillStyle = "#55c95a";
        ctx.fillRect(0, groundY, width, height - groundY);
        ctx.fillStyle = "#6bd16f";
        for (let x = -20; x < width + 20; x += 38) {
          ctx.beginPath();
          ctx.ellipse(x, groundY + 12, 34, 8, 0, 0, TAU);
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(width * 0.52, groundY + layout.minSide * 0.15, layout.minSide * 0.28, Math.PI, TAU);
        ctx.stroke();
      }

      function drawSpaceBackground(layout) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#111827");
        sky.addColorStop(0.55, "#312e81");
        sky.addColorStop(1, "#4c1d95");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        for (let i = 0; i < 52; i += 1) {
          const x = (i * 73 + 19) % Math.max(1, width);
          const y = (i * 41 + 27) % Math.max(1, layout.groundY - 20);
          const r = 1 + (i % 3) * 0.55;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }

        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(width * 0.18, height * 0.17, clamp(layout.minSide * 0.06, 24, 42), 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(17, 24, 39, 0.35)";
        ctx.beginPath();
        ctx.arc(width * 0.2, height * 0.145, clamp(layout.minSide * 0.06, 24, 42), 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#6d28d9";
        ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
        ctx.fillStyle = "#8b5cf6";
        for (let x = -20; x < width + 20; x += 48) {
          ctx.beginPath();
          ctx.ellipse(x, layout.groundY + 12, 38, 9, 0, 0, TAU);
          ctx.fill();
        }
      }

      function drawCourtOverlay(court, layout) {
        if (court.tint) {
          ctx.fillStyle = court.tint;
          ctx.fillRect(0, 0, width, height);
        }

        if (court.id === "beach") {
          ctx.fillStyle = "rgba(14, 165, 233, 0.28)";
          ctx.fillRect(0, layout.groundY - layout.minSide * 0.18, width, layout.minSide * 0.24);
          ctx.fillStyle = "rgba(253, 230, 138, 0.75)";
          ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
          ctx.lineWidth = 3;
          for (let y = layout.groundY - layout.minSide * 0.16; y < layout.groundY - 8; y += 18) {
            ctx.beginPath();
            for (let x = -20; x <= width + 20; x += 18) {
              const waveY = y + Math.sin((x + game.time * 65) * 0.04) * 3;
              if (x === -20) ctx.moveTo(x, waveY);
              else ctx.lineTo(x, waveY);
            }
            ctx.stroke();
          }
        } else if (court.id === "jungle") {
          ctx.fillStyle = "rgba(21, 128, 61, 0.24)";
          for (let i = 0; i < 8; i += 1) {
            const x = (i * 113 + 29) % Math.max(1, width);
            const y = layout.groundY - 18 - (i % 3) * 22;
            ctx.beginPath();
            ctx.ellipse(x, y, 24, 8, (i % 2 ? -0.35 : 0.35), 0, TAU);
            ctx.fill();
          }
        } else if (court.id === "ice") {
          ctx.fillStyle = "rgba(219, 234, 254, 0.68)";
          ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
          ctx.strokeStyle = "rgba(14, 165, 233, 0.28)";
          ctx.lineWidth = 4;
          for (let x = -30; x < width + 30; x += 44) {
            ctx.beginPath();
            ctx.moveTo(x, layout.groundY + 18);
            ctx.lineTo(x + 28, layout.groundY + 4);
            ctx.stroke();
          }
        } else if (court.id === "desert") {
          ctx.fillStyle = "rgba(251, 191, 36, 0.6)";
          ctx.fillRect(0, layout.groundY - layout.minSide * 0.03, width, height - layout.groundY + layout.minSide * 0.03);
          ctx.fillStyle = "rgba(180, 83, 9, 0.2)";
          for (let x = -20; x < width + 20; x += 70) {
            ctx.beginPath();
            ctx.ellipse(x, layout.groundY + 24, 50, 9, 0, 0, TAU);
            ctx.fill();
          }
        } else if (court.id === "candy") {
          ctx.fillStyle = "rgba(252, 231, 243, 0.76)";
          ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
          for (let x = 20; x < width; x += 68) {
            ctx.fillStyle = x % 136 === 20 ? "#f9a8d4" : "#93c5fd";
            ctx.beginPath();
            ctx.arc(x, layout.groundY + 26, 9, 0, TAU);
            ctx.fill();
          }
        } else if (court.id === "city") {
          ctx.fillStyle = "rgba(71, 85, 105, 0.2)";
          for (let x = 0; x < width; x += 54) {
            const h = 48 + (x % 4) * 16;
            fillRoundedRect(x, layout.groundY - h, 38, h, 4, "rgba(51, 65, 85, 0.35)");
          }
        } else if (court.id === "moon") {
          ctx.fillStyle = "rgba(199, 210, 254, 0.38)";
          ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
          ctx.fillStyle = "rgba(99, 102, 241, 0.24)";
          for (let x = 12; x < width; x += 82) {
            ctx.beginPath();
            ctx.arc(x, layout.groundY + 25, 15, 0, TAU);
            ctx.fill();
          }
        } else if (court.id === "rainbow") {
          const bands = ["rgba(251, 113, 133, 0.35)", "rgba(250, 204, 21, 0.35)", "rgba(34, 197, 94, 0.3)", "rgba(96, 165, 250, 0.3)"];
          for (let i = 0; i < bands.length; i += 1) {
            ctx.strokeStyle = bands[i];
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.arc(width * 0.5, layout.groundY + layout.minSide * 0.16, layout.minSide * (0.52 + i * 0.05), Math.PI, TAU);
            ctx.stroke();
          }
        }
      }

      function drawCourtFloor(layout, color, lineColor) {
        ctx.fillStyle = color;
        ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = Math.max(3, layout.minSide * 0.008);
        ctx.beginPath();
        ctx.moveTo(width * 0.08, layout.groundY + layout.minSide * 0.05);
        ctx.lineTo(width * 0.92, layout.groundY + layout.minSide * 0.05);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(width * 0.52, layout.groundY + layout.minSide * 0.16, layout.minSide * 0.26, Math.PI, TAU);
        ctx.stroke();
      }

      function drawAdventureCourtBackground(court, layout) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);

        if (court.id === "ice") {
          sky.addColorStop(0, "#bae6fd");
          sky.addColorStop(0.62, "#e0f2fe");
          sky.addColorStop(1, "#f8fafc");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          drawCloud(width * 0.7, height * 0.13, layout.minSide * 0.07, 0.72);
          ctx.fillStyle = "#ffffff";
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.moveTo(width * (0.12 + i * 0.24), layout.groundY);
            ctx.lineTo(width * (0.27 + i * 0.18), layout.groundY - layout.minSide * (0.22 + i * 0.03));
            ctx.lineTo(width * (0.44 + i * 0.19), layout.groundY);
            ctx.closePath();
            ctx.fill();
          }
          ctx.fillStyle = "#67e8f9";
          for (let x = 28; x < width; x += 86) {
            ctx.beginPath();
            ctx.moveTo(x, layout.groundY - 18);
            ctx.lineTo(x + 16, layout.groundY - 70);
            ctx.lineTo(x + 32, layout.groundY - 18);
            ctx.closePath();
            ctx.fill();
          }
          drawCourtFloor(layout, "#dbeafe", "rgba(14, 165, 233, 0.55)");
          return;
        }

        if (court.id === "desert") {
          sky.addColorStop(0, "#fed7aa");
          sky.addColorStop(0.62, "#fde68a");
          sky.addColorStop(1, "#fef3c7");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = "#f59e0b";
          ctx.beginPath();
          ctx.arc(width * 0.14, height * 0.14, layout.minSide * 0.065, 0, TAU);
          ctx.fill();
          for (let i = 0; i < 4; i += 1) {
            ctx.fillStyle = i % 2 ? "#fbbf24" : "#f59e0b";
            ctx.beginPath();
            ctx.ellipse(width * (0.1 + i * 0.28), layout.groundY - layout.minSide * 0.02, layout.minSide * 0.24, layout.minSide * 0.08, -0.08, 0, TAU);
            ctx.fill();
          }
          ctx.strokeStyle = "#15803d";
          ctx.lineWidth = 8;
          ctx.lineCap = "round";
          for (const x of [width * 0.1, width * 0.9]) {
            ctx.beginPath();
            ctx.moveTo(x, layout.groundY - 25);
            ctx.lineTo(x, layout.groundY - 92);
            ctx.moveTo(x, layout.groundY - 68);
            ctx.lineTo(x + (x < width * 0.5 ? 24 : -24), layout.groundY - 88);
            ctx.stroke();
          }
          drawCourtFloor(layout, "#fbbf24", "rgba(146, 64, 14, 0.48)");
          return;
        }

        if (court.id === "candy") {
          sky.addColorStop(0, "#fbcfe8");
          sky.addColorStop(0.58, "#fdf2f8");
          sky.addColorStop(1, "#fef3c7");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          drawCloud(width * 0.24, height * 0.14, layout.minSide * 0.075, 0.8);
          drawCloud(width * 0.72, height * 0.2, layout.minSide * 0.07, 0.64);
          ctx.fillStyle = "#f9a8d4";
          for (let x = -30; x < width + 30; x += 95) {
            ctx.beginPath();
            ctx.arc(x, layout.groundY - 34, 24, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x, layout.groundY - 10);
            ctx.lineTo(x, layout.groundY - 78);
            ctx.stroke();
          }
          drawCourtFloor(layout, "#f9a8d4", "rgba(255, 255, 255, 0.75)");
          ctx.fillStyle = "rgba(254, 240, 138, 0.72)";
          for (let x = 24; x < width; x += 70) {
            ctx.beginPath();
            ctx.arc(x, layout.groundY + 26, 8, 0, TAU);
            ctx.fill();
          }
          return;
        }

        if (court.id === "city") {
          sky.addColorStop(0, "#bfdbfe");
          sky.addColorStop(0.65, "#e0f2fe");
          sky.addColorStop(1, "#f8fafc");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          for (let x = -12; x < width + 50; x += 48) {
            const h = layout.minSide * (0.16 + ((x / 48) % 4) * 0.035);
            fillRoundedRect(x, layout.groundY - h, 36, h, 4, x % 96 === 0 ? "#64748b" : "#475569");
            ctx.fillStyle = "#fde68a";
            for (let y = layout.groundY - h + 12; y < layout.groundY - 10; y += 22) {
              ctx.fillRect(x + 8, y, 6, 8);
              ctx.fillRect(x + 22, y, 6, 8);
            }
          }
          drawCourtFloor(layout, "#94a3b8", "rgba(255, 255, 255, 0.62)");
          return;
        }

        if (court.id === "moon") {
          drawSpaceBackground(layout);
          ctx.fillStyle = "#c7d2fe";
          ctx.beginPath();
          ctx.arc(width * 0.76, height * 0.16, layout.minSide * 0.07, 0, TAU);
          ctx.fill();
          ctx.fillStyle = "rgba(79, 70, 229, 0.38)";
          for (let i = 0; i < 5; i += 1) {
            ctx.beginPath();
            ctx.arc(width * (0.18 + i * 0.16), layout.groundY - layout.minSide * 0.02, layout.minSide * (0.025 + (i % 2) * 0.012), 0, TAU);
            ctx.fill();
          }
          drawCourtFloor(layout, "#a5b4fc", "rgba(255, 255, 255, 0.58)");
          return;
        }

        if (court.id === "rainbow") {
          sky.addColorStop(0, "#bae6fd");
          sky.addColorStop(0.55, "#dcfce7");
          sky.addColorStop(1, "#fef9c3");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, height);
          const bands = ["#fb7185", "#f97316", "#facc15", "#22c55e", "#60a5fa", "#a78bfa"];
          for (let i = 0; i < bands.length; i += 1) {
            ctx.strokeStyle = bands[i];
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(width * 0.5, layout.groundY + layout.minSide * 0.18, layout.minSide * (0.58 + i * 0.055), Math.PI, TAU);
            ctx.stroke();
          }
          drawCloud(width * 0.18, layout.groundY - layout.minSide * 0.17, layout.minSide * 0.08, 0.9);
          drawCloud(width * 0.82, layout.groundY - layout.minSide * 0.16, layout.minSide * 0.08, 0.9);
          drawCourtFloor(layout, "#86efac", "rgba(255, 255, 255, 0.7)");
          return;
        }

        if (court.id === "space") {
          drawSpaceBackground(layout);
          return;
        }

        drawProceduralBackground(layout);
        drawCourtOverlay(court, layout);
      }

      function drawBackground(layout) {
        const court = getCurrentCourt();
        const orientation = width >= height ? "landscape" : "portrait";
        const courtAssetId = `background.${court.id}.${orientation}`;
        if (drawCoverImage(courtAssetId)) return;
        drawAdventureCourtBackground(court, layout);
      }

      function drawCloud(x, y, size, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x - size * 0.7, y + size * 0.12, size * 0.48, 0, TAU);
        ctx.arc(x - size * 0.2, y - size * 0.05, size * 0.62, 0, TAU);
        ctx.arc(x + size * 0.45, y + size * 0.08, size * 0.5, 0, TAU);
        ctx.rect(x - size * 0.8, y, size * 1.55, size * 0.45);
        ctx.fill();
        ctx.restore();
      }

      function drawProceduralHoop(layout) {
        const hoop = layout.hoop;
        const poleTop = hoop.y - hoop.rimR * 1.4;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#5b6b7a";
        ctx.lineWidth = Math.max(5, hoop.rimR * 0.22);
        ctx.beginPath();
        ctx.moveTo(hoop.poleX, poleTop);
        ctx.lineTo(hoop.poleX, layout.groundY + 6);
        ctx.stroke();

        fillRoundedRect(hoop.x + hoop.rimR * 0.62, hoop.y - hoop.rimR * 1.42, hoop.rimR * 1.8, hoop.rimR * 1.35, 8, "#f8fafc");
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 3;
        roundedRect(hoop.x + hoop.rimR * 0.62, hoop.y - hoop.rimR * 1.42, hoop.rimR * 1.8, hoop.rimR * 1.35, 8);
        ctx.stroke();

        ctx.strokeStyle = "#f97316";
        ctx.lineWidth = Math.max(5, hoop.rimR * 0.18);
        ctx.beginPath();
        ctx.ellipse(hoop.x, hoop.y, hoop.rimR, hoop.rimR * 0.32, 0, 0, TAU);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i += 1) {
          const startX = hoop.x + i * hoop.rimR * 0.33;
          ctx.beginPath();
          ctx.moveTo(startX, hoop.y + hoop.rimR * 0.16);
          ctx.lineTo(hoop.x + i * hoop.rimR * 0.18, hoop.y + hoop.rimR * 1.15);
          ctx.stroke();
        }
      }

      function drawHoopBack(layout) {
        if (!getAsset("prop.hoopBack") || !getAsset("prop.hoopFront")) {
          drawProceduralHoop(layout);
          return;
        }
        const hoop = layout.hoop;
        const asset = ASSET_DEFS["prop.hoopBack"];
        const widthScale = asset ? asset.logicalWidthScale : 5.4;
        drawHoopPoleExtension(layout);
        drawSprite("prop.hoopBack", hoop.x, hoop.y, hoop.rimR * widthScale);
      }

      function drawHoopPoleExtension(layout) {
        const hoop = layout.hoop;
        const topY = hoop.y + hoop.rimR * 1.45;
        const bottomY = layout.groundY + 8;
        if (bottomY <= topY) return;

        const x = hoop.x;
        const poleW = Math.max(12, hoop.rimR * 0.54);
        ctx.save();
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(71, 85, 105, 0.38)";
        ctx.lineWidth = poleW + 7;
        ctx.beginPath();
        ctx.moveTo(x + 2, topY + 2);
        ctx.lineTo(x + 2, bottomY);
        ctx.stroke();

        ctx.strokeStyle = "#aeb8c3";
        ctx.lineWidth = poleW;
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.lineTo(x, bottomY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
        ctx.lineWidth = Math.max(3, poleW * 0.22);
        ctx.beginPath();
        ctx.moveTo(x - poleW * 0.22, topY + 6);
        ctx.lineTo(x - poleW * 0.22, bottomY - 8);
        ctx.stroke();

        fillRoundedRect(x - poleW * 1.15, layout.groundY - 2, poleW * 2.3, poleW * 0.82, poleW * 0.32, "#8f9aa6");
        ctx.restore();
      }

      function drawHoopFront(layout) {
        if (!getAsset("prop.hoopBack") || !getAsset("prop.hoopFront")) return;
        const hoop = layout.hoop;
        const asset = ASSET_DEFS["prop.hoopFront"];
        const widthScale = asset ? asset.logicalWidthScale : 3.05;
        const wobble = game.rimWobble > 0 ? Math.sin(game.time * 44) * hoop.rimR * 0.05 * game.rimWobble : 0;
        ctx.save();
        ctx.translate(0, wobble);
        drawSprite("prop.hoopFront", hoop.x, hoop.y, hoop.rimR * widthScale);
        ctx.restore();
      }

      function drawHoop(layout) {
        drawHoopBack(layout);
        drawHoopFront(layout);
      }

      function drawDinoAccessory(dino, size, layer) {
        ctx.save();
        ctx.lineJoin = "round";
        if (dino.accessory === "wings" && layer === "behind") {
          ctx.fillStyle = dino.dark;
          ctx.globalAlpha *= 0.45;
          ctx.beginPath();
          ctx.moveTo(-size * 0.16, -size * 0.54);
          ctx.quadraticCurveTo(-size * 0.72, -size * 0.82, -size * 0.76, -size * 0.28);
          ctx.quadraticCurveTo(-size * 0.48, -size * 0.42, -size * 0.16, -size * 0.38);
          ctx.closePath();
          ctx.fill();
        }
        if (dino.accessory === "sail" && layer === "behind") {
          ctx.fillStyle = dino.dark;
          ctx.globalAlpha *= 0.52;
          ctx.beginPath();
          ctx.moveTo(-size * 0.38, -size * 0.62);
          ctx.lineTo(-size * 0.18, -size * 0.96);
          ctx.lineTo(size * 0.06, -size * 0.66);
          ctx.lineTo(size * 0.18, -size * 0.9);
          ctx.lineTo(size * 0.3, -size * 0.58);
          ctx.closePath();
          ctx.fill();
        }
        if (dino.accessory === "longneck" && layer === "behind") {
          fillRoundedRect(size * 0.06, -size * 1.17, size * 0.22, size * 0.56, size * 0.1, dino.body);
          fillRoundedRect(size * 0.14, -size * 1.3, size * 0.34, size * 0.2, size * 0.1, dino.body);
        }
        if (dino.accessory === "club" && layer === "behind") {
          ctx.strokeStyle = dino.dark;
          ctx.lineWidth = Math.max(5, size * 0.06);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-size * 0.48, -size * 0.36);
          ctx.lineTo(-size * 0.86, -size * 0.26);
          ctx.stroke();
          ctx.fillStyle = dino.dark;
          ctx.beginPath();
          ctx.arc(-size * 0.94, -size * 0.22, size * 0.12, 0, TAU);
          ctx.fill();
        }

        if (layer === "front") {
          if (dino.accessory === "horns") {
            ctx.fillStyle = "#fef3c7";
            ctx.strokeStyle = "#92400e";
            ctx.lineWidth = Math.max(2, size * 0.018);
            const hornPoints = [
              [size * 0.36, -size * 0.9, size * 0.2, -size * 1.08, size * 0.43, -size * 0.82],
              [size * 0.55, -size * 0.84, size * 0.76, -size * 0.96, size * 0.58, -size * 0.72]
            ];
            for (const points of hornPoints) {
              ctx.beginPath();
              ctx.moveTo(points[0], points[1]);
              ctx.lineTo(points[2], points[3]);
              ctx.lineTo(points[4], points[5]);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          } else if (dino.accessory === "plates") {
            ctx.fillStyle = "#fef08a";
            ctx.strokeStyle = dino.dark;
            ctx.lineWidth = Math.max(2, size * 0.018);
            for (let i = 0; i < 5; i += 1) {
              const x = -size * 0.42 + i * size * 0.16;
              const y = -size * (0.67 + Math.sin(i) * 0.04);
              ctx.beginPath();
              ctx.moveTo(x, y);
              ctx.lineTo(x + size * 0.08, y - size * 0.18);
              ctx.lineTo(x + size * 0.17, y);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          } else if (dino.accessory === "runner") {
            ctx.strokeStyle = dino.dark;
            ctx.lineWidth = Math.max(3, size * 0.035);
            for (let i = 0; i < 3; i += 1) {
              ctx.beginPath();
              ctx.moveTo(-size * (0.34 - i * 0.12), -size * 0.72);
              ctx.lineTo(-size * (0.26 - i * 0.12), -size * 0.86);
              ctx.stroke();
            }
          } else if (dino.accessory === "dome") {
            ctx.fillStyle = "#fef3c7";
            ctx.strokeStyle = dino.dark;
            ctx.lineWidth = Math.max(2, size * 0.018);
            ctx.beginPath();
            ctx.arc(size * 0.42, -size * 0.88, size * 0.18, Math.PI * 1.05, Math.PI * 1.95);
            ctx.fill();
            ctx.stroke();
          } else if (dino.accessory === "crest") {
            ctx.fillStyle = dino.dark;
            ctx.beginPath();
            ctx.ellipse(size * 0.36, -size * 0.97, size * 0.09, size * 0.28, -0.7, 0, TAU);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawProceduralDino(x, groundY, size, mood, dino = getCurrentDino()) {
        const react = game.dinoReact;
        const happyHop = mood === "happy" ? Math.sin((react / 0.58) * Math.PI) * -size * 0.16 : 0;
        const launchLean = mood === "launch" ? react / 0.18 : 0;
        const shrug = mood === "shrug" ? react / 0.34 : 0;
        const squash = mood === "happy" ? Math.sin((react / 0.58) * Math.PI) * 0.07 : 0;
        const breathe = mood === "idle" || mood === "happy" ? Math.sin(game.time * 2.3 + size * 0.01) * 0.012 : 0;

        ctx.save();
        ctx.translate(x, groundY + happyHop);
        ctx.rotate(-launchLean * 0.08 + shrug * 0.04);
        ctx.scale(1 + squash + breathe, 1 - squash - breathe * 0.45);

        drawDinoAccessory(dino, size, "behind");

        ctx.fillStyle = dino.body;
        ctx.beginPath();
        ctx.moveTo(-size * 0.48, -size * 0.38);
        ctx.lineTo(-size * 0.88, -size * 0.55);
        ctx.lineTo(-size * 0.46, -size * 0.18);
        ctx.closePath();
        ctx.fill();

        fillRoundedRect(-size * 0.48, -size * 0.62, size * 0.82, size * 0.44, size * 0.18, dino.body);
        fillRoundedRect(size * 0.12, -size * 0.93, size * 0.46, size * 0.34, size * 0.14, dino.body);
        fillRoundedRect(size * 0.43, -size * 0.86, size * 0.28, size * 0.18, size * 0.08, dino.body);

        ctx.fillStyle = dino.belly;
        ctx.beginPath();
        ctx.ellipse(-size * 0.08, -size * 0.43, size * 0.26, size * 0.13, 0, 0, TAU);
        ctx.fill();

        fillRoundedRect(-size * 0.34, -size * 0.21, size * 0.17, size * 0.22, size * 0.07, dino.dark);
        fillRoundedRect(size * 0.04, -size * 0.21, size * 0.17, size * 0.22, size * 0.07, dino.dark);
        fillRoundedRect(-size * 0.39, -size * 0.03, size * 0.24, size * 0.07, size * 0.04, "#14532d");
        fillRoundedRect(size * 0.01, -size * 0.03, size * 0.24, size * 0.07, size * 0.04, "#14532d");

        ctx.strokeStyle = dino.dark;
        ctx.lineWidth = Math.max(4, size * 0.055);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(size * 0.23, -size * 0.51);
        ctx.lineTo(size * (0.43 + shrug * 0.06), -size * (0.43 + shrug * 0.1));
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(size * 0.47, -size * 0.81, size * 0.035, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(2, size * 0.025);
        ctx.beginPath();
        ctx.arc(size * 0.57, -size * 0.76, size * 0.07, 0.15, Math.PI * 0.78);
        ctx.stroke();

        drawDinoAccessory(dino, size, "front");

        ctx.restore();
      }

      function drawDinoForDino(dino, x, groundY, size, mood) {
        const react = game.dinoReact;
        const happyActive = mood === "happy" && (react > 0.01 || game.state === STATE.START);
        const happyHop = happyActive ? Math.sin((react / 0.58) * Math.PI) * -size * 0.16 : 0;
        const launchLean = mood === "launch" ? react / 0.18 : 0;
        const shrug = mood === "shrug" ? react / 0.34 : 0;
        const squash = happyActive ? Math.sin((react / 0.58) * Math.PI) * 0.07 : 0;
        const breathe = mood === "idle" || mood === "happy" ? Math.sin(game.time * 2.3 + size * 0.01) * 0.012 : 0;
        const pose = getPoseForMood(mood, happyActive);
        const spriteChoice = getDinoSpriteChoice(dino, pose);
        const spriteId = spriteChoice.id;
        const specificSprite = spriteChoice.specific;
        const asset = ASSET_DEFS[spriteId];
        const widthScale = asset ? asset.logicalWidthScale : 1.5;
        ctx.save();
        ctx.translate(x, groundY + happyHop);
        ctx.rotate(-launchLean * 0.08 + shrug * 0.04);
        ctx.scale(1 + squash + breathe, 1 - squash - breathe * 0.45);
        if (!specificSprite) drawDinoAccessory(dino, size, "behind");
        ctx.filter = specificSprite ? "none" : `hue-rotate(${dino.hue || 0}deg) saturate(${dino.saturation || 1})`;
        const drewSprite = drawSprite(spriteId, 0, 0, size * widthScale);
        ctx.filter = "none";
        if (drewSprite && !specificSprite) drawDinoAccessory(dino, size, "front");
        ctx.restore();

        if (!drewSprite) drawProceduralDino(x, groundY, size, mood, dino);
      }

      function drawDino(x, groundY, size, mood) {
        drawDinoForDino(getCurrentDino(), x, groundY, size, mood);
      }

      function getPowerDinoMotion(layout) {
        if (!game.powerMove) return { dx: 0, dy: 0, scale: 1, rotation: 0 };
        const move = game.powerMove;
        const p = clamp(move.time / move.duration, 0, 1);
        const hop = Math.sin(p * Math.PI);
        const dash = Math.sin(p * Math.PI);
        const forward = (layout.hoop.x - layout.dino.x) * 0.28;
        const smallForward = (layout.hoop.x - layout.dino.x) * 0.14;
        const motion = { dx: 0, dy: 0, scale: 1, rotation: 0 };

        if (move.type === "stompDunk") {
          motion.dx = forward * dash;
          motion.dy = -layout.dino.size * 0.3 * hop;
          motion.scale = 1 + 0.1 * hop;
          motion.rotation = -0.08 * hop;
        } else if (move.type === "tripleShot") {
          motion.dx = smallForward * dash;
          motion.dy = -layout.dino.size * 0.12 * Math.abs(Math.sin(p * Math.PI * 3));
          motion.rotation = Math.sin(p * Math.PI * 6) * 0.035;
        } else if (move.type === "starShield") {
          motion.dy = -layout.dino.size * 0.08 * hop;
          motion.scale = 1 + 0.16 * hop;
          motion.rotation = Math.sin(p * Math.PI * 4) * 0.08;
        } else if (move.type === "floatShot") {
          motion.dx = layout.dino.size * 0.18 * hop;
          motion.dy = -layout.dino.size * 0.85 * hop;
          motion.rotation = -0.12 * hop;
        } else if (move.type === "zoomShot") {
          motion.dx = forward * 1.25 * dash;
          motion.dy = -layout.dino.size * 0.08 * hop;
          motion.scale = 1 + 0.08 * hop;
          motion.rotation = -0.1 * hop;
        } else if (move.type === "splashShot") {
          motion.dx = smallForward * dash;
          motion.dy = Math.sin(p * Math.PI * 2) * layout.dino.size * 0.08;
          motion.rotation = Math.sin(p * Math.PI * 3) * 0.08;
        } else if (move.type === "bounceShot") {
          motion.dx = smallForward * dash;
          motion.dy = -layout.dino.size * 0.45 * Math.sin(p * Math.PI * 1.4);
          motion.scale = 1 + 0.12 * hop;
          motion.rotation = 0.14 * hop;
        } else if (move.type === "pinballRoll") {
          motion.dx = smallForward * 0.9 * dash;
          motion.dy = -layout.dino.size * 0.12 * Math.abs(Math.sin(p * Math.PI * 4));
          motion.rotation = p * TAU * 1.25;
        } else if (move.type === "skyLob") {
          motion.dx = layout.dino.size * 0.12 * hop;
          motion.dy = -layout.dino.size * 0.28 * hop;
          motion.scale = 1 + 0.14 * hop;
          motion.rotation = -0.06 * hop;
        } else if (move.type === "musicEcho") {
          motion.dx = layout.dino.size * 0.12 * Math.sin(p * Math.PI * 2);
          motion.dy = -layout.dino.size * 0.2 * Math.abs(Math.sin(p * Math.PI * 3));
          motion.scale = 1 + 0.08 * Math.abs(Math.sin(p * Math.PI * 3));
          motion.rotation = Math.sin(p * Math.PI * 5) * 0.05;
        }

        if (p > 0.78) {
          const settle = easeOutCubic((p - 0.78) / 0.22);
          motion.dx *= 1 - settle;
          motion.dy *= 1 - settle;
          motion.rotation *= 1 - settle;
          motion.scale = 1 + (motion.scale - 1) * (1 - settle);
        }

        return motion;
      }

      function drawPowerAura(layout, motion) {
        if (!game.powerMove) return;
        const dino = getDinoById(game.powerMove.dinoId);
        const p = clamp(game.powerMove.time / game.powerMove.duration, 0, 1);
        const pulse = Math.sin(p * Math.PI);
        const x = layout.dino.x + motion.dx;
        const y = layout.dino.y + motion.dy - layout.dino.size * 0.62;
        const palette = dino.powerPalette || dino.particles;

        ctx.save();
        ctx.globalAlpha = 0.25 + 0.45 * pulse;
        ctx.strokeStyle = palette[0] || "#fef08a";
        ctx.fillStyle = palette[1] || "#ffffff";
        ctx.lineWidth = Math.max(4, layout.dino.size * 0.05);
        if (dino.power === "zoomShot") {
          for (let i = 0; i < 4; i += 1) {
            ctx.beginPath();
            ctx.moveTo(x - layout.dino.size * (1.1 + i * 0.22), y + i * 8);
            ctx.lineTo(x - layout.dino.size * (0.42 + i * 0.08), y + i * 8);
            ctx.stroke();
          }
        } else if (dino.power === "splashShot") {
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.arc(x, y + layout.dino.size * 0.32, layout.dino.size * (0.35 + i * 0.16) * pulse, Math.PI, TAU);
            ctx.stroke();
          }
        } else if (dino.power === "musicEcho") {
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.arc(x + i * layout.dino.size * 0.18, y - i * layout.dino.size * 0.12, layout.dino.size * 0.08, 0, TAU);
            ctx.fill();
          }
        } else {
          ctx.beginPath();
          ctx.arc(x, y, layout.dino.size * (0.48 + pulse * 0.38), 0, TAU);
          ctx.stroke();
          if (dino.power === "starShield" || dino.power === "skyLob") {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(game.time * 4);
            drawStar(0, 0, layout.dino.size * 0.18, layout.dino.size * 0.4);
            ctx.restore();
          }
        }
        ctx.restore();
      }

      function drawDinoWithMotion(x, groundY, size, mood, motion) {
        if (!motion || (!motion.dx && !motion.dy && motion.scale === 1 && !motion.rotation)) {
          drawDino(x, groundY, size, mood);
          return;
        }
        ctx.save();
        ctx.translate(x + motion.dx, groundY + motion.dy);
        ctx.rotate(motion.rotation);
        ctx.scale(motion.scale, motion.scale);
        drawDino(0, 0, size, mood);
        ctx.restore();
      }

      function drawShotTrail(ball) {
        if (!ball.trail || ball.trail.length < 2 || ball.shotKind === "normal") return;
        ctx.save();
        ctx.lineCap = "round";
        for (let i = 0; i < ball.trail.length - 1; i += 1) {
          const point = ball.trail[i];
          const next = ball.trail[i + 1];
          const t = i / Math.max(1, ball.trail.length - 1);
          ctx.globalAlpha = t * 0.58;
          ctx.lineWidth = ball.r * (0.25 + t * 0.35);
          if (ball.shotKind === "rainbow") {
            ctx.strokeStyle = `hsl(${Math.floor(t * 280 + game.time * 80) % 360}, 95%, 62%)`;
          } else if (ball.shotKind === "moon") {
            ctx.strokeStyle = "#fde68a";
          } else if (ball.shotKind === "bank") {
            ctx.strokeStyle = "#93c5fd";
          } else if (ball.shotKind === "bubble") {
            ctx.strokeStyle = "#67e8f9";
          } else if (ball.shotKind === "star") {
            ctx.strokeStyle = "#fef08a";
          } else if (ball.shotKind === "splash") {
            ctx.strokeStyle = "#67e8f9";
          } else if (ball.shotKind === "music") {
            ctx.strokeStyle = i % 2 ? "#f9a8d4" : "#93c5fd";
          } else if (ball.shotKind === "triple") {
            ctx.strokeStyle = i % 2 ? "#fef08a" : "#7dd3fc";
          } else if (ball.shotKind === "pinball") {
            ctx.strokeStyle = "#a3e635";
          } else if (ball.shotKind === "bounce") {
            ctx.strokeStyle = "#fb923c";
          } else {
            ctx.strokeStyle = "#fb923c";
          }
          ctx.beginPath();
          ctx.moveTo(point.x, point.y);
          ctx.lineTo(next.x, next.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBall(ball, idleScale) {
        let stretch = clamp(Math.hypot(ball.vx, ball.vy) / 1700, 0, 0.16);
        let apexPuff = 0;
        if (ball.state === "flying" && !ball.scored) {
          apexPuff = clamp(1 - Math.abs(ball.vy) / 280, 0, 1) * 0.08;
        }
        const squeeze = ball.squeeze * 0.16;
        const sx = idleScale * (1 + stretch + squeeze - apexPuff * 0.25);
        const sy = idleScale * (1 - stretch * 0.55 - squeeze + apexPuff);
        const ballAsset = ASSET_DEFS["prop.basketball"];
        const widthScale = ballAsset ? ballAsset.logicalWidthScale : 2.28;
        const rotation = ball.state === "flying" ? ball.age * 7 + ball.x * 0.01 : game.time * 0.08;

        if (ball.shotKind === "bubble") {
          ctx.save();
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = "#67e8f9";
          ctx.lineWidth = Math.max(3, ball.r * 0.22);
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r * 1.45, 0, TAU);
          ctx.stroke();
          ctx.restore();
        } else if (ball.shotKind === "star") {
          ctx.save();
          ctx.translate(ball.x, ball.y);
          ctx.rotate(game.time * 4);
          ctx.fillStyle = "rgba(254, 240, 138, 0.62)";
          drawStar(0, 0, ball.r * 0.8, ball.r * 1.65);
          ctx.restore();
        } else if (ball.shotKind === "splash") {
          ctx.save();
          ctx.globalAlpha = 0.36;
          ctx.strokeStyle = "#67e8f9";
          ctx.lineWidth = Math.max(3, ball.r * 0.2);
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r * 1.38, Math.PI * 0.1, Math.PI * 1.25);
          ctx.stroke();
          ctx.restore();
        } else if (ball.shotKind === "music") {
          ctx.save();
          ctx.strokeStyle = "rgba(249, 168, 212, 0.7)";
          ctx.fillStyle = "rgba(249, 168, 212, 0.65)";
          ctx.lineWidth = Math.max(2, ball.r * 0.12);
          const noteX = ball.x + ball.r * 1.35;
          const noteY = ball.y - ball.r * 1.2;
          ctx.beginPath();
          ctx.moveTo(noteX, noteY - ball.r * 0.55);
          ctx.lineTo(noteX, noteY + ball.r * 0.28);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(noteX - ball.r * 0.16, noteY + ball.r * 0.3, ball.r * 0.22, 0, TAU);
          ctx.fill();
          ctx.restore();
        } else if (ball.shotKind === "pinball") {
          ctx.save();
          ctx.globalAlpha = 0.45;
          ctx.strokeStyle = "#a3e635";
          ctx.lineWidth = Math.max(2, ball.r * 0.16);
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r * 1.55, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }

        if (drawSprite("prop.basketball", ball.x, ball.y, ball.r * widthScale, {
          scaleX: sx,
          scaleY: sy,
          rotation
        })) return;

        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.scale(sx, sy);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(0, 0, ball.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#7c2d12";
        ctx.lineWidth = Math.max(2, ball.r * 0.12);
        ctx.beginPath();
        ctx.arc(0, 0, ball.r * 0.98, 0, TAU);
        ctx.moveTo(-ball.r, 0);
        ctx.lineTo(ball.r, 0);
        ctx.moveTo(0, -ball.r);
        ctx.lineTo(0, ball.r);
        ctx.moveTo(-ball.r * 0.72, -ball.r * 0.72);
        ctx.quadraticCurveTo(0, 0, -ball.r * 0.72, ball.r * 0.72);
        ctx.moveTo(ball.r * 0.72, -ball.r * 0.72);
        ctx.quadraticCurveTo(0, 0, ball.r * 0.72, ball.r * 0.72);
        ctx.stroke();
        ctx.restore();
      }

      function drawCompanionBalls(ball) {
        if (!ball.companions || !ball.companions.length || ball.state === "ready") return;
        const progress = clamp(ball.age / Math.max(0.01, ball.flightTime), 0, 1);
        for (const companion of ball.companions) {
          const fadeIn = clamp((ball.age - companion.delay) / 0.18, 0, 1);
          if (fadeIn <= 0) continue;
          const ghost = {
            ...ball,
            x: ball.x + companion.dx * (1 - progress * 0.35),
            y: ball.y + companion.dy * (1 - progress * 0.25),
            r: ball.r * 0.82,
            vx: ball.vx,
            vy: ball.vy,
            squeeze: ball.squeeze * 0.8,
            shotKind: ball.shotKind === "music" ? "star" : ball.shotKind
          };
          ctx.save();
          ctx.globalAlpha = 0.36 * fadeIn;
