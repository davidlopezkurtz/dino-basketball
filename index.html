          drawBall(ghost, 1);
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of game.particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          drawParticleShape(p.shape, p.size, p.color);
          ctx.restore();
        }
      }

      function drawParticleShape(shape, size, color) {
        if (shape === "star") {
          drawStar(0, 0, size * 0.65, size * 1.2);
          return;
        }
        if (shape === "leaf") {
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.9, size * 0.38, 0.35, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "rgba(15, 23, 42, 0.12)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-size * 0.55, 0);
          ctx.lineTo(size * 0.55, 0);
          ctx.stroke();
          return;
        }
        if (shape === "shell") {
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.78, Math.PI, TAU);
          ctx.lineTo(size * 0.78, size * 0.38);
          ctx.lineTo(-size * 0.78, size * 0.38);
          ctx.closePath();
          ctx.fill();
          return;
        }
        if (shape === "spark") {
          ctx.beginPath();
          ctx.moveTo(0, -size * 1.1);
          ctx.lineTo(size * 0.32, -size * 0.22);
          ctx.lineTo(size * 1.05, 0);
          ctx.lineTo(size * 0.25, size * 0.25);
          ctx.lineTo(0, size * 1.05);
          ctx.lineTo(-size * 0.25, size * 0.25);
          ctx.lineTo(-size * 1.05, 0);
          ctx.lineTo(-size * 0.32, -size * 0.22);
          ctx.closePath();
          ctx.fill();
          return;
        }
        if (shape === "planet") {
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.72, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1, size * 0.22);
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 1.25, size * 0.42, -0.35, 0, TAU);
          ctx.stroke();
          return;
        }
        if (shape === "stomp") {
          ctx.globalAlpha *= 0.65;
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 1.25, size * 0.38, 0, 0, TAU);
          ctx.fill();
          return;
        }
        fillRoundedRect(-size * 0.5, -size * 0.25, size, size * 0.5, 2, color);
      }

      function drawStar(x, y, inner, outer) {
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const radius = i % 2 === 0 ? outer : inner;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const px = x + Math.cos(angle) * radius;
          const py = y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawEgg(x, y, size, dino, crack = 0) {
        ctx.save();
        const wobble = Math.sin(game.time * 10) * crack * 0.06;
        ctx.translate(x, y);
        ctx.rotate(wobble);

        const split = clamp((crack - 0.68) / 0.32, 0, 1) * size * 0.1;
        ctx.fillStyle = dino.egg;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.18)";
        ctx.lineWidth = Math.max(2, size * 0.03);
        ctx.beginPath();
        ctx.ellipse(-split, 0, size * 0.42, size * 0.56, -0.08, Math.PI * 0.45, Math.PI * 1.55);
        ctx.ellipse(split, 0, size * 0.42, size * 0.56, 0.08, -Math.PI * 0.55, Math.PI * 0.55);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        ctx.beginPath();
        ctx.ellipse(-size * 0.12, -size * 0.14, size * 0.08, size * 0.13, -0.45, 0, TAU);
        ctx.fill();
        ctx.fillStyle = dino.body;
        for (let i = 0; i < 4; i += 1) {
          ctx.beginPath();
          ctx.ellipse(size * (-0.2 + i * 0.14), size * (0.14 - (i % 2) * 0.34), size * 0.055, size * 0.04, i * 0.4, 0, TAU);
          ctx.fill();
        }

        if (crack > 0.12) {
          ctx.strokeStyle = "rgba(15, 23, 42, 0.55)";
          ctx.lineWidth = Math.max(2, size * 0.025);
          ctx.beginPath();
          ctx.moveTo(-size * 0.2, -size * 0.08);
          ctx.lineTo(-size * 0.05, size * 0.03);
          ctx.lineTo(size * 0.05, -size * 0.03);
          ctx.lineTo(size * 0.22, size * 0.08);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawOpenEggShell(x, y, size, dino, open) {
        const lift = size * 0.1 * open;
        const spread = size * 0.32 * open;
        const rotate = 0.7 * open;
        ctx.save();
        ctx.fillStyle = dino.egg;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.18)";
        ctx.lineWidth = Math.max(2, size * 0.03);

        ctx.save();
        ctx.translate(x - spread, y - lift);
        ctx.rotate(-rotate);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.29, size * 0.36, -0.2, Math.PI * 0.55, Math.PI * 1.58);
        ctx.lineTo(size * 0.09, size * 0.25);
        ctx.lineTo(-size * 0.04, size * 0.16);
        ctx.lineTo(size * 0.04, size * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.translate(x + spread, y - lift);
        ctx.rotate(rotate);
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.29, size * 0.36, 0.2, -Math.PI * 0.58, Math.PI * 0.45);
        ctx.lineTo(-size * 0.09, size * 0.25);
        ctx.lineTo(size * 0.04, size * 0.16);
        ctx.lineTo(-size * 0.04, size * 0.06);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.beginPath();
        ctx.ellipse(x, y + size * 0.24, size * 0.34, size * 0.16, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function getPlayControls(layout) {
        const size = clamp(layout.minSide * 0.13, 52, 68);
        const y = height - layout.safe.bottom - size * 0.68;
        return [
          { type: "picker", x: layout.safe.left + size * 0.74, y, r: size * 0.52, size },
          { type: "stickers", x: layout.safe.left + size * 1.95, y, r: size * 0.52, size },
          { type: "power", x: width - layout.safe.right - size * 0.74, y, r: size * 0.58, size }
        ];
      }

      function drawCourtIcon(x, y, size) {
        const court = getCurrentCourt();
        ctx.save();
        ctx.translate(x, y);
        fillRoundedRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44, size * 0.08, "#e0f2fe");
        if (court.id === "space") {
          ctx.fillStyle = "#312e81";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44);
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.arc(size * 0.13, -size * 0.07, size * 0.06, 0, TAU);
          ctx.fill();
        } else if (court.id === "volcano") {
          ctx.fillStyle = "#7f1d1d";
          ctx.beginPath();
          ctx.moveTo(-size * 0.24, size * 0.18);
          ctx.lineTo(0, -size * 0.18);
          ctx.lineTo(size * 0.25, size * 0.18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.arc(0, -size * 0.12, size * 0.05, 0, TAU);
          ctx.fill();
        } else if (court.id === "beach") {
          ctx.fillStyle = "#38bdf8";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.23);
          ctx.fillStyle = "#fde68a";
          ctx.fillRect(-size * 0.32, size * 0.01, size * 0.64, size * 0.21);
        } else if (court.id === "ice") {
          ctx.fillStyle = "#bae6fd";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44);
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-size * 0.22, size * 0.1);
          ctx.lineTo(size * 0.2, -size * 0.12);
          ctx.stroke();
        } else if (court.id === "desert") {
          ctx.fillStyle = "#fbbf24";
          ctx.fillRect(-size * 0.32, -size * 0.02, size * 0.64, size * 0.24);
          ctx.fillStyle = "#fed7aa";
          ctx.beginPath();
          ctx.arc(-size * 0.14, -size * 0.1, size * 0.08, 0, TAU);
          ctx.fill();
        } else if (court.id === "candy") {
          ctx.fillStyle = "#f9a8d4";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44);
          ctx.fillStyle = "#fef08a";
          drawStar(0, 0, size * 0.08, size * 0.18);
        } else if (court.id === "city") {
          ctx.fillStyle = "#475569";
          for (let i = 0; i < 3; i += 1) {
            ctx.fillRect(-size * 0.24 + i * size * 0.17, -size * (0.02 + i * 0.05), size * 0.12, size * 0.24 + i * size * 0.05);
          }
        } else if (court.id === "moon") {
          ctx.fillStyle = "#c4b5fd";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44);
          ctx.fillStyle = "#e0e7ff";
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.16, 0, TAU);
          ctx.fill();
        } else if (court.id === "rainbow") {
          const arcs = ["#fb7185", "#facc15", "#22c55e", "#60a5fa"];
          for (let i = 0; i < arcs.length; i += 1) {
            ctx.strokeStyle = arcs[i];
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, size * 0.18, size * (0.16 + i * 0.06), Math.PI, TAU);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = "#22c55e";
          ctx.beginPath();
          ctx.ellipse(0, size * 0.08, size * 0.29, size * 0.12, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPowerIcon(icon, x, y, size, charged, dino) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = charged ? "#0f172a" : "rgba(15, 23, 42, 0.35)";
        ctx.fillStyle = charged ? (dino.powerPalette && dino.powerPalette[0]) || "#fef08a" : "rgba(148, 163, 184, 0.5)";
        ctx.lineWidth = Math.max(2, size * 0.06);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (icon === "triple") {
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.arc((i - 1) * size * 0.2, (i % 2) * size * 0.12, size * 0.14, 0, TAU);
            ctx.fill();
            ctx.stroke();
          }
        } else if (icon === "splash") {
          for (let i = 0; i < 3; i += 1) {
            ctx.beginPath();
            ctx.arc((i - 1) * size * 0.18, size * 0.02, size * (0.12 + i * 0.015), Math.PI, TAU);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(0, -size * 0.16, size * 0.11, 0, TAU);
          ctx.fill();
        } else if (icon === "feather") {
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.16, size * 0.35, -0.65, 0, TAU);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-size * 0.12, size * 0.22);
          ctx.lineTo(size * 0.18, -size * 0.28);
          ctx.stroke();
        } else if (icon === "zoom") {
          ctx.beginPath();
          ctx.moveTo(-size * 0.3, -size * 0.16);
          ctx.lineTo(size * 0.18, -size * 0.16);
          ctx.lineTo(size * 0.34, 0);
          ctx.lineTo(size * 0.18, size * 0.16);
          ctx.lineTo(-size * 0.3, size * 0.16);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-size * 0.36, 0);
          ctx.lineTo(-size * 0.14, 0);
          ctx.stroke();
        } else if (icon === "bounce") {
          ctx.beginPath();
          ctx.arc(0, -size * 0.08, size * 0.16, 0, TAU);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, size * 0.18, size * 0.25, Math.PI * 1.05, Math.PI * 1.95);
          ctx.stroke();
        } else if (icon === "pinball") {
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.25, 0, TAU);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.08, 0, TAU);
          ctx.fill();
        } else if (icon === "rainbow") {
          const arcs = ["#f97316", "#fef08a", "#22c55e", "#60a5fa"];
          for (let i = 0; i < arcs.length; i += 1) {
            ctx.strokeStyle = charged ? arcs[i] : "rgba(15, 23, 42, 0.25)";
            ctx.beginPath();
            ctx.arc(0, size * 0.18, size * (0.18 + i * 0.08), Math.PI, TAU);
            ctx.stroke();
          }
        } else if (icon === "music") {
          ctx.beginPath();
          ctx.moveTo(size * 0.04, -size * 0.28);
          ctx.lineTo(size * 0.04, size * 0.15);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(-size * 0.1, size * 0.18, size * 0.12, 0, TAU);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(size * 0.04, -size * 0.28);
          ctx.lineTo(size * 0.26, -size * 0.2);
          ctx.stroke();
        } else if (icon === "star") {
          drawStar(0, 0, size * 0.13, size * 0.31);
        } else {
          ctx.beginPath();
          ctx.ellipse(0, size * 0.08, size * 0.3, size * 0.16, 0, 0, TAU);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawPlayControls(layout) {
        game.uiTargets = getPlayControls(layout);
        for (const target of game.uiTargets) {
          const isPower = target.type === "power";
          const charged = game.powerCharge > 0;
          const bounce = isPower && game.powerBounce > 0 ? Math.sin(game.powerBounce * 38) * 4 : 0;
          ctx.save();
          ctx.globalAlpha = isPower && !charged ? 0.78 : 0.94;
          ctx.fillStyle = isPower && charged ? "rgba(254, 240, 138, 0.92)" : "rgba(255, 255, 255, 0.82)";
          ctx.beginPath();
          ctx.arc(target.x, target.y + bounce, target.r * (isPower && game.powerFlash > 0 ? 1.04 + Math.sin(game.time * 18) * 0.025 : 1), 0, TAU);
          ctx.fill();
          ctx.strokeStyle = isPower && charged ? "#f97316" : "rgba(15, 23, 42, 0.18)";
          ctx.lineWidth = isPower && charged ? 5 : 3;
          ctx.stroke();
          ctx.restore();

          if (target.type === "picker") {
            drawDinoForDino(getCurrentDino(), target.x, target.y + target.size * 0.32, target.size * 0.35, "happy");
          } else if (target.type === "stickers") {
            ctx.save();
            ctx.translate(target.x, target.y);
            ctx.fillStyle = "#fef08a";
            drawStar(0, 0, target.size * 0.16, target.size * 0.36);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          } else if (target.type === "power") {
            const dino = getCurrentDino();
            drawPowerIcon(dino.powerIcon, target.x, target.y + bounce, target.size * 0.72, charged, dino);
            if (!charged && game.powerMeter > 0) {
              ctx.save();
              ctx.strokeStyle = "rgba(249, 115, 22, 0.7)";
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.arc(target.x, target.y + bounce, target.r * 0.78, -Math.PI / 2, -Math.PI / 2 + TAU * (game.powerMeter / CONFIG.POWER_CHARGE_MAKES));
              ctx.stroke();
              ctx.restore();
            }
          }
        }
      }

      function getBackButton(layout) {
        const size = clamp(layout.minSide * 0.12, 46, 62);
        return {
          type: "back",
          x: layout.safe.left + size * 0.75,
          y: layout.safe.top + size * 0.75,
          r: size * 0.5,
          size
        };
      }

      function getResetHoldTarget(layout) {
        const size = clamp(layout.minSide * 0.095, 38, 52);
        return {
          x: width - layout.safe.right - size * 0.78,
          y: layout.safe.top + size * 0.78,
          r: size * 0.48,
          size
        };
      }

      function drawResetHoldTarget(layout) {
        if (!(game.state === STATE.END || (game.state === STATE.PLAY && game.score >= CONFIG.FINAL_SCORE && game.finaleSeen))) return;
        const target = getResetHoldTarget(layout);
        const progress = game.resetHold && game.resetHold.active ? clamp(game.resetHold.time / CONFIG.PARENT_HOLD_SECONDS, 0, 1) : 0;
        ctx.save();
        ctx.globalAlpha = game.state === STATE.END ? 0.92 : 0.68;
        ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(3, target.size * 0.075);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.size * 0.18, Math.PI * 0.25, Math.PI * 1.72);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(target.x - target.size * 0.13, target.y - target.size * 0.16);
        ctx.lineTo(target.x - target.size * 0.25, target.y - target.size * 0.16);
        ctx.lineTo(target.x - target.size * 0.2, target.y - target.size * 0.04);
        ctx.stroke();

        if (progress > 0) {
          ctx.strokeStyle = "#f97316";
          ctx.lineWidth = Math.max(4, target.size * 0.09);
          ctx.beginPath();
          ctx.arc(target.x, target.y, target.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * progress);
          ctx.stroke();
        }
        ctx.restore();
      }

      function getPickerTiles(layout) {
        const columns = width >= height ? 5 : 3;
        const gap = clamp(layout.minSide * 0.03, 10, 18);
        const tile = Math.min(clamp(layout.minSide * 0.21, 70, 112), (width * 0.9 - (columns - 1) * gap) / columns);
        const rows = Math.ceil(DINOS.length / columns);
        const gridW = tile * columns + gap * (columns - 1);
        const gridH = tile * rows + gap * (rows - 1);
        const startX = width * 0.5 - gridW * 0.5 + tile * 0.5;
        const startY = height * 0.5 - gridH * 0.5 + tile * 0.5 + layout.safe.top * 0.2;
        return DINOS.map((dino, index) => ({
          dino,
          x: startX + (index % columns) * (tile + gap),
          y: startY + Math.floor(index / columns) * (tile + gap),
          w: tile,
          h: tile,
          locked: !game.unlockedDinos.includes(dino.id)
        }));
      }

      function getStickerTiles(layout) {
        const items = [
          ...DINOS.map((dino) => ({ type: "dino", dino, locked: !game.unlockedDinos.includes(dino.id) })),
          ...COURTS.map((court) => ({ type: "court", court, locked: !unlockedCourtsForScore(game.score).includes(court.id) }))
        ];
        const columns = width >= height ? 10 : 5;
        const gap = clamp(layout.minSide * 0.018, 7, 13);
        const maxTileW = (width * 0.92 - (columns - 1) * gap) / columns;
        const tile = Math.min(clamp(layout.minSide * 0.145, 48, 74), maxTileW);
        const rows = Math.ceil(items.length / columns);
        const gridW = columns * tile + (columns - 1) * gap;
        const gridH = rows * tile + (rows - 1) * gap;
        const startX = width * 0.5 - gridW * 0.5 + tile * 0.5;
        const startY = height * 0.52 - gridH * 0.5 + layout.safe.top * 0.08;
        return items.map((item, index) => ({
          ...item,
          x: startX + (index % columns) * (tile + gap),
          y: startY + Math.floor(index / columns) * (tile + gap),
          w: tile,
          h: tile
        }));
      }

      function drawCourtBanner(layout) {
        if (game.courtFlash <= 0) return;
        const alpha = clamp(game.courtFlash / CONFIG.COURT_FLASH_SECONDS, 0, 1);
        const h = clamp(layout.minSide * 0.11, 42, 58);
        const w = clamp(layout.minSide * 0.46, 160, 240);
        const x = width * 0.5 - w * 0.5;
        const y = layout.safe.top + clamp(layout.minSide * 0.16, 62, 86);
        ctx.save();
        ctx.globalAlpha = Math.min(0.9, alpha);
        fillRoundedRect(x, y, w, h, 18, "rgba(255, 255, 255, 0.86)");
        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${Math.floor(h * 0.48)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(getCurrentCourt().title, width * 0.5, y + h * 0.53);
        ctx.restore();
      }

      function drawScore(layout) {
        const x = layout.safe.left + 16;
        const y = layout.safe.top + 14;
        const h = clamp(layout.minSide * 0.115, 46, 58);
        const w = Math.max(104, h * 1.9);
        if (!drawSprite("ui.scoreBadge", x, y + h * 0.5, w, {
          anchorX: 0,
          anchorY: 0.5,
          logicalHeight: h
        })) {
          fillRoundedRect(x, y, w, h, 18, "rgba(255, 255, 255, 0.78)");
        }
        const iconBall = { x: x + h * 0.48, y: y + h * 0.5, r: h * 0.25, vx: 0, vy: 0, state: "ready", squeeze: 0 };
        drawBall(iconBall, 1);
        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${Math.floor(h * 0.58)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(String(game.score), x + h * 0.92, y + h * 0.52);
      }

      function drawStart(layout) {
        drawBackground(layout);
        drawHoopBack(layout);
        const titleY = layout.safe.top + clamp(height * 0.12, 70, 120);
        ctx.fillStyle = "#0f172a";
        ctx.font = `900 ${clamp(layout.minSide * 0.105, 34, 56)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Dino Basketball", width * 0.5, titleY);

        const pulse = 1 + Math.sin(game.time * 3.2) * 0.035;
        drawDino(width * 0.48, layout.groundY, clamp(layout.minSide * 0.28, 96, 140) * pulse, "happy");
        const floatingBall = {
          x: width * 0.68,
          y: layout.groundY - clamp(layout.minSide * 0.48, 150, 220) + Math.sin(game.time * 4) * 8,
          r: clamp(layout.minSide * 0.055, 19, 30),
          vx: 80,
          vy: Math.sin(game.time) * 60,
          state: "flying",
          squeeze: 0
        };
        drawBall(floatingBall, 1);
        drawHoopFront(layout);

        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${clamp(layout.minSide * 0.07, 24, 36)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillText("Tap to play", width * 0.5, height - clamp(height * 0.16, 78, 130));
      }

      function drawEnd(layout) {
        const endTime = game.end ? game.end.time : 0;
        drawBackground(layout);
        drawHoopBack(layout);
        drawDino(layout.dino.x, layout.dino.y, layout.dino.size * (1 + Math.sin(game.time * 7) * 0.035), "happy");
        drawHoopFront(layout);
        drawScore(layout);

        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.52)";
        ctx.fillRect(0, 0, width, height);
        drawParticles();

        const centerY = height * 0.38 + layout.safe.top * 0.2;
        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `900 ${clamp(layout.minSide * 0.13, 42, 68)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillText("You did it!", width * 0.5, centerY);
        ctx.font = `900 ${clamp(layout.minSide * 0.1, 34, 56)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillText(`${CONFIG.FINAL_SCORE} baskets!`, width * 0.5, centerY + clamp(layout.minSide * 0.14, 52, 76));

        const dinoSize = clamp(layout.minSide * 0.24, 88, 132);
        drawDino(width * 0.5, height * 0.78, dinoSize * (1 + Math.sin(game.time * 4) * 0.04), "happy");

        ctx.font = `800 ${clamp(layout.minSide * 0.06, 22, 32)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.globalAlpha = endTime >= CONFIG.END_RESTART_DELAY ? 1 : 0.35;
        ctx.fillText("Tap to keep playing", width * 0.5, height - layout.safe.bottom - clamp(height * 0.1, 54, 86));
        ctx.restore();
        drawResetHoldTarget(layout);
      }

      function drawHoopSparkles(layout) {
        if (game.hoopSparkle <= 0) return;
        const hoop = layout.hoop;
        const count = 8;
        ctx.save();
        ctx.globalAlpha = clamp(game.hoopSparkle / 1.2, 0, 1);
        ctx.fillStyle = "#fef08a";
        for (let i = 0; i < count; i += 1) {
          const angle = game.time * 4 + i * TAU / count;
          const r = hoop.rimR * (1.2 + (i % 2) * 0.28);
          ctx.save();
          ctx.translate(hoop.x + Math.cos(angle) * r, hoop.y + Math.sin(angle) * r * 0.45);
          ctx.rotate(angle);
          drawStar(0, 0, 3, 7);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawCrown(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#facc15";
        ctx.strokeStyle = "#b45309";
        ctx.lineWidth = Math.max(2, size * 0.06);
        ctx.beginPath();
        ctx.moveTo(-size * 0.5, size * 0.25);
        ctx.lineTo(-size * 0.42, -size * 0.35);
        ctx.lineTo(-size * 0.15, size * 0.02);
        ctx.lineTo(0, -size * 0.45);
        ctx.lineTo(size * 0.15, size * 0.02);
        ctx.lineTo(size * 0.42, -size * 0.35);
        ctx.lineTo(size * 0.5, size * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawSurprise(layout) {
        const surprise = game.surprise;
        const celebration = game.dinoCelebration;
        if (surprise && surprise.type === "crown") {
          const bob = Math.sin(game.time * 8) * 4;
          drawCrown(layout.dino.x + layout.dino.size * 0.12, layout.dino.y - layout.dino.size * 1.2 + bob, layout.dino.size * 0.42);
        }

        if (surprise && surprise.type === "parade") {
          const progress = surprise.time / surprise.duration;
          const baseY = layout.groundY + layout.minSide * 0.06;
          for (let i = 0; i < 6; i += 1) {
            const x = ((progress * width * 1.4) + i * layout.minSide * 0.18) % (width + 80) - 40;
            const y = baseY + Math.sin(game.time * 5 + i) * 5;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = COLORS[i % COLORS.length];
            drawStar(0, 0, 5, 12);
            ctx.restore();
          }
        }

        if (celebration && celebration.type === "trex") {
          ctx.save();
          ctx.globalAlpha = 0.35 * (1 - celebration.time / celebration.duration);
          ctx.fillStyle = "#92400e";
          ctx.beginPath();
          ctx.ellipse(layout.dino.x - layout.dino.size * 0.12, layout.dino.y + 4, layout.dino.size * 0.62, layout.dino.size * 0.1, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        } else if (celebration && celebration.type === "ptero") {
          ctx.save();
          ctx.globalAlpha = 0.55 * (1 - celebration.time / celebration.duration);
          ctx.strokeStyle = "#a78bfa";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(layout.dino.x, layout.dino.y - layout.dino.size * 0.7, layout.dino.size * (0.55 + celebration.time), 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawPlay(layout) {
        drawBackground(layout);
        drawHoopBack(layout);
        const dinoMotion = getPowerDinoMotion(layout);
        drawPowerAura(layout, dinoMotion);
        drawDinoWithMotion(layout.dino.x, layout.dino.y, layout.dino.size, game.dinoMood, dinoMotion);
        drawShotTrail(game.ball);
        drawCompanionBalls(game.ball);
        drawBall(game.ball, 1);
        drawHoopFront(layout);
        drawHoopSparkles(layout);
        drawParticles();
        drawScore(layout);
        drawCourtBanner(layout);
        drawPlayControls(layout);
        drawResetHoldTarget(layout);
        drawSurprise(layout);
      }

      function drawHatch(layout) {
        const hatch = game.hatch || { time: 0, revealTime: 0, duration: CONFIG.HATCH_SECONDS, dinoId: game.selectedDino, taps: 0, revealed: false };
        const dino = getDinoById(hatch.dinoId);
        const tapProgress = clamp((hatch.taps || 0) / CONFIG.HATCH_TAPS, 0, 1);
        const idleWobble = Math.sin(game.time * 5) * (hatch.revealed ? 0 : 1);
        const crack = hatch.revealed ? 1 : clamp((tapProgress - 0.05) / 0.8, 0, 0.96);
        const reveal = hatch.revealed ? clamp(hatch.revealTime / CONFIG.HATCH_REVEAL_SECONDS, 0, 1) : 0;
        const eggSize = clamp(layout.minSide * 0.34, 116, 176);
        const centerX = width * 0.5;
        const eggY = height * 0.51;
        const dinoSize = clamp(layout.minSide * 0.26, 92, 138);

        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.38)";
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalAlpha = 0.2 + reveal * 0.28;
        ctx.fillStyle = "#fef9c3";
        ctx.beginPath();
        ctx.ellipse(centerX, eggY + eggSize * 0.06, eggSize * (0.55 + reveal * 0.35), eggSize * (0.48 + reveal * 0.26), 0, 0, TAU);
        ctx.fill();
        ctx.restore();

        drawParticles();

        ctx.save();
        ctx.globalAlpha = reveal;
        ctx.translate(centerX, eggY + eggSize * 0.74 - reveal * eggSize * 0.44);
        ctx.scale(0.72 + reveal * 0.28, 0.72 + reveal * 0.28);
        drawDinoForDino(dino, 0, 0, dinoSize, "happy");
        ctx.restore();

        if (hatch.revealed) {
          drawOpenEggShell(centerX, eggY + eggSize * 0.18, eggSize, dino, reveal);
        } else {
          drawEgg(centerX, eggY + idleWobble * (3 + crack * 6), eggSize, dino, crack);
        }

        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const titleY = layout.safe.top + clamp(height * 0.14, 76, 118);
        if (hatch.revealed && reveal > 0.72) {
          const nameText = `${dino.name || dino.id}!`;
          let fontSize = clamp(layout.minSide * 0.088, 28, 52);
          ctx.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          while (ctx.measureText(nameText).width > width * 0.9 && fontSize > 20) {
            fontSize -= 2;
            ctx.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          }
          ctx.fillText(nameText, width * 0.5, titleY);
          ctx.font = `800 ${clamp(layout.minSide * 0.045, 18, 28)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.fillText("New dino!", width * 0.5, titleY + fontSize * 0.8);
        } else {
          ctx.font = `900 ${clamp(layout.minSide * 0.095, 32, 54)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.fillText("Tap egg!", width * 0.5, titleY);
        }
      }

      function drawPicker(layout) {
        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.fillRect(0, 0, width, height);

        const back = getBackButton(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.86)";
        ctx.beginPath();
        ctx.arc(back.x, back.y, back.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(4, back.size * 0.075);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(back.x + back.size * 0.13, back.y - back.size * 0.18);
        ctx.lineTo(back.x - back.size * 0.13, back.y);
        ctx.lineTo(back.x + back.size * 0.13, back.y + back.size * 0.18);
        ctx.stroke();

        game.pickerTargets = getPickerTiles(layout);
        for (const tile of game.pickerTargets) {
          const selected = tile.dino.id === game.selectedDino;
          const bounce = tile.locked && game.pickerBounce > 0 ? Math.sin(game.pickerBounce * 44) * 4 : 0;
          const x = tile.x - tile.w * 0.5;
          const y = tile.y - tile.h * 0.5 + bounce;
          fillRoundedRect(x, y, tile.w, tile.h, 18, selected ? "rgba(254, 240, 138, 0.92)" : "rgba(255, 255, 255, 0.84)");
          ctx.strokeStyle = selected ? "#f97316" : "rgba(15, 23, 42, 0.18)";
          ctx.lineWidth = selected ? 5 : 3;
          roundedRect(x, y, tile.w, tile.h, 18);
          ctx.stroke();

          if (tile.locked) {
            drawEgg(tile.x, tile.y + tile.h * 0.02 + bounce, tile.w * 0.54, tile.dino, 0);
          } else {
            drawDinoForDino(tile.dino, tile.x, tile.y + tile.h * 0.38 + bounce, tile.w * 0.42, "happy");
          }
        }
      }

      function drawStickerBook(layout) {
        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
        ctx.fillRect(0, 0, width, height);

        const back = getBackButton(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(back.x, back.y, back.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(4, back.size * 0.075);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(back.x + back.size * 0.13, back.y - back.size * 0.18);
        ctx.lineTo(back.x - back.size * 0.13, back.y);
        ctx.lineTo(back.x + back.size * 0.13, back.y + back.size * 0.18);
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = `900 ${clamp(layout.minSide * 0.085, 28, 44)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Stickers", width * 0.5, layout.safe.top + clamp(layout.minSide * 0.15, 58, 84));

        game.stickerTargets = getStickerTiles(layout);
        for (const tile of game.stickerTargets) {
          const earned = !tile.locked;
          const selected = (tile.type === "dino" && tile.dino.id === game.selectedDino) ||
            (tile.type === "court" && tile.court.id === game.court);
          drawStickerTile(tile.x, tile.y, tile.w, earned, selected);
          ctx.save();
          ctx.globalAlpha = earned ? 1 : 0.34;
          if (tile.type === "dino") {
            if (earned) drawDinoForDino(tile.dino, tile.x, tile.y + tile.h * 0.32, tile.w * 0.34, "happy");
            else drawEgg(tile.x, tile.y + tile.h * 0.04, tile.w * 0.45, tile.dino, 0);
          } else {
            const oldCourt = game.court;
            game.court = tile.court.id;
            drawCourtIcon(tile.x, tile.y, tile.w * 0.78);
            game.court = oldCourt;
          }
          ctx.restore();
        }
      }

      function drawStickerTile(x, y, size, earned, selected = false) {
        const left = x - size * 0.5;
        const top = y - size * 0.5;
        fillRoundedRect(left, top, size, size, 16, earned ? "rgba(255, 255, 255, 0.88)" : "rgba(255, 255, 255, 0.55)");
        ctx.strokeStyle = selected ? "#f97316" : earned ? "#facc15" : "rgba(15, 23, 42, 0.18)";
        ctx.lineWidth = selected ? 5 : earned ? 4 : 3;
        roundedRect(left, top, size, size, 16);
        ctx.stroke();
        if (!earned) {
          ctx.save();
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = "#0f172a";
          drawStar(x, y, size * 0.16, size * 0.34);
          ctx.restore();
        }
      }

      function draw() {
        const layout = getLayout();
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        if (game.shakeLeft > 0) {
          const t = game.shakeLeft / (CONFIG.SHAKE_MS / 1000);
          const amount = CONFIG.SHAKE_INTENSITY * t * t;
          ctx.translate(rand(-amount, amount), rand(-amount, amount));
        }

        if (game.state === STATE.START) drawStart(layout);
        else if (game.state === STATE.HATCH) drawHatch(layout);
        else if (game.state === STATE.PICKER) drawPicker(layout);
        else if (game.state === STATE.STICKERS) drawStickerBook(layout);
        else if (game.state === STATE.END) drawEnd(layout);
        else drawPlay(layout);

        ctx.restore();
      }

      function getTapPoint(event) {
        const touch = event && event.changedTouches && event.changedTouches[0];
        const source = touch || event || { clientX: width * 0.5, clientY: height * 0.5 };
        return {
          x: source.clientX,
          y: source.clientY
        };
      }

      function hitCircle(point, target, pad = 0) {
        return Math.hypot(point.x - target.x, point.y - target.y) <= target.r + pad;
      }

      function hitRect(point, tile) {
        return point.x >= tile.x - tile.w * 0.5 &&
          point.x <= tile.x + tile.w * 0.5 &&
          point.y >= tile.y - tile.h * 0.5 &&
          point.y <= tile.y + tile.h * 0.5;
      }

      function handlePlayControlTap(point) {
        const layout = getLayout();
        for (const target of getPlayControls(layout)) {
          if (!hitCircle(point, target, 12)) continue;

          if (target.type === "picker") {
            game.state = STATE.PICKER;
            game.queuedShot = false;
            game.autoLaunchDelay = 0;
            playTap();
            return true;
          }

          if (target.type === "stickers") {
            game.state = STATE.STICKERS;
            game.queuedShot = false;
            game.autoLaunchDelay = 0;
            playTap();
            return true;
          }

          if (target.type === "power") {
            if (game.powerCharge > 0) {
              launchShot({ power: true });
            } else {
              game.powerBounce = CONFIG.POWER_BUTTON_BOUNCE_MS / 1000;
              spawnParticles(target.x, target.y, 8, getCurrentDino().particles, "star");
              playTap();
            }
            return true;
          }
        }
        return false;
      }

      function handlePickerTap(point) {
        const layout = getLayout();
        const back = getBackButton(layout);
        if (hitCircle(point, back, 10)) {
          game.state = STATE.PLAY;
          playTap();
          resetReadyBall();
          return;
        }

        for (const tile of getPickerTiles(layout)) {
          if (!hitRect(point, tile)) continue;
          if (tile.locked) {
            game.pickerBounce = 0.3;
            playMiss();
            return;
          }

          game.selectedDino = tile.dino.id;
          game.state = STATE.PLAY;
          game.dinoReact = 0.46;
          game.dinoMood = "happy";
          saveGame();
          playTap();
          resetReadyBall();
          return;
        }
      }

      function handleBackOnlyTap(point) {
        const layout = getLayout();
        const back = getBackButton(layout);
        if (hitCircle(point, back, 10)) {
          game.state = STATE.PLAY;
          playTap();
          resetReadyBall();
        }
      }

      function handleStickerBookTap(point) {
        const layout = getLayout();
        const back = getBackButton(layout);
        if (hitCircle(point, back, 10)) {
          game.state = STATE.PLAY;
          playTap();
          resetReadyBall();
          return;
        }

        for (const tile of getStickerTiles(layout)) {
          if (!hitRect(point, tile)) continue;
          if (tile.locked) {
            game.pickerBounce = 0.3;
            playMiss();
            return;
          }
          if (tile.type === "court") {
            game.court = tile.court.id;
            game.courtFlash = CONFIG.COURT_FLASH_SECONDS * 0.8;
            game.state = STATE.PLAY;
            const juice = getCourtJuice(game.court);
            spawnParticles(width * 0.5, height * 0.32, Math.floor(CONFIG.PARTICLE_COUNT * 0.45), juice.palette, juice.shape);
            saveGame();
            playTap();
            resetReadyBall();
            return;
          }
          if (tile.type === "dino") {
            game.selectedDino = tile.dino.id;
            game.state = STATE.PLAY;
            game.dinoReact = 0.46;
            game.dinoMood = "happy";
            saveGame();
            playTap();
            resetReadyBall();
            return;
          }
        }
      }

      function revealHatchDino() {
        if (!game.hatch || game.hatch.revealed) return;
        const dino = getDinoById(game.hatch.dinoId);
        game.hatch.revealed = true;
        game.hatch.revealTime = 0;
        game.hatch.taps = CONFIG.HATCH_TAPS;
        game.selectedDino = dino.id;
        game.dinoReact = 0.8;
        game.dinoMood = "happy";
        game.shakeLeft = Math.max(game.shakeLeft, CONFIG.SHAKE_MS / 1000);
        spawnParticles(width * 0.5, height * 0.43, CONFIG.PARTICLE_COUNT + 48, dino.particles, "star");
        playFanfare(dino);
        speakDinoName(dino);
        saveGame();
      }

      function handleHatchTap(point) {
        if (!game.hatch) return;
        if (game.hatch.revealed) {
          if (game.hatch.revealTime >= CONFIG.END_RESTART_DELAY) {
            endHatch();
          } else {
            const dino = getDinoById(game.hatch.dinoId);
            spawnParticles(point.x, point.y, 8, dino.particles, "star");
            playTap();
          }
          return;
        }

        game.hatch.taps += 1;
        const dino = getDinoById(game.hatch.dinoId);
        const layout = getLayout();
        const crackProgress = clamp(game.hatch.taps / CONFIG.HATCH_TAPS, 0, 1);
        spawnParticles(width * 0.5, height * 0.5, 14 + game.hatch.taps * 5, dino.particles, "star");
        game.shakeLeft = Math.max(game.shakeLeft, 0.04 + crackProgress * 0.1);
        playTap();
        if (game.hatch.taps >= CONFIG.HATCH_TAPS) {
          revealHatchDino();
        } else if (game.hatch.taps >= CONFIG.HATCH_TAPS - 1) {
          spawnParticles(layout.dino.x, height * 0.45, CONFIG.PARTICLE_COUNT, dino.particles, "star");
        }
      }

      function handleEndTap() {
        if (!game.end || game.end.time < CONFIG.END_RESTART_DELAY) {
          const dino = getCurrentDino();
          spawnParticles(width * 0.5, height * 0.36, 12, dino.particles, "star");
          playTap();
          return;
        }
        game.finaleSeen = true;
        game.pendingEnd = false;
        game.end = null;
        game.state = STATE.PLAY;
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        saveGame();
        resetReadyBall();
        playTap();
      }

      function canUseResetHold() {
        return game.state === STATE.END || (game.state === STATE.PLAY && game.score >= CONFIG.FINAL_SCORE && game.finaleSeen);
      }

      function handlePressStart(event) {
        if (event) event.preventDefault();
        if (!canUseResetHold()) return false;
        const point = getTapPoint(event);
        const target = getResetHoldTarget(getLayout());
        if (!hitCircle(point, target, 10)) return false;
        ensureAudio();
        game.resetHold = { active: true, time: 0 };
        suppressNextTapUntil = performance.now() + CONFIG.PARENT_HOLD_SECONDS * 1000 + 350;
        playTap();
        return true;
      }

      function handlePressEnd(event) {
        if (game.resetHold && game.resetHold.active) {
          if (event) event.preventDefault();
          game.resetHold = null;
          suppressNextTapUntil = performance.now() + 260;
          return true;
        }
        return false;
      }

      function handleTap(event) {
        if (event) event.preventDefault();
        const point = getTapPoint(event);
        const now = performance.now();
        if (now < suppressNextTapUntil) return;
        if (now - lastTapAt < 90) return;
        lastTapAt = now;

        ensureAudio();
        if (game.state === STATE.START) {
          if (game.score >= CONFIG.FINAL_SCORE && !game.finaleSeen) {
            startEndCelebration();
            return;
          }
          game.state = STATE.PLAY;
          game.dinoReact = 0.4;
          game.dinoMood = "happy";
          playTap();
          resetReadyBall();
          return;
        }

        if (game.state === STATE.HATCH) {
          handleHatchTap(point);
          return;
        }

        if (game.state === STATE.END) {
          handleEndTap();
          return;
        }

        if (game.state === STATE.PICKER) {
          handlePickerTap(point);
          return;
        }

        if (game.state === STATE.STICKERS) {
          handleStickerBookTap(point);
          return;
        }

        if (handlePlayControlTap(point)) return;
        if (game.score >= CONFIG.FINAL_SCORE && !game.finaleSeen) {
          startEndCelebration();
          return;
        }
        launchShot();
      }

      function preventGesture(event) {
        event.preventDefault();
      }

      canvas.addEventListener("touchend", handleTap, { passive: false });
      canvas.addEventListener("touchstart", handlePressStart, { passive: false });
      canvas.addEventListener("pointerup", (event) => {
        if (event.pointerType !== "touch") {
          if (handlePressEnd(event)) return;
          handleTap(event);
        }
      }, { passive: false });
      canvas.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "touch") handlePressStart(event);
      }, { passive: false });
      canvas.addEventListener("touchend", (event) => {
        handlePressEnd(event);
      }, { passive: false });
      canvas.addEventListener("touchmove", preventGesture, { passive: false });
      canvas.addEventListener("contextmenu", preventGesture);
      document.addEventListener("gesturestart", preventGesture, { passive: false });
      document.addEventListener("gesturechange", preventGesture, { passive: false });
      document.addEventListener("gestureend", preventGesture, { passive: false });
      document.addEventListener("touchmove", preventGesture, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (event) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      function loop(now) {
        const dt = clamp((now - lastTime) / 1000, 0, 0.033);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeCanvas);
      }

      resizeCanvas();
      loadAssets();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
