<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Dino Basketball</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #8bd7ff;
      position: fixed;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-text-size-adjust: 100%;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Dino Basketball game"></canvas>

  <script src="assets/manifest.js?v=20260529-dino-court-assets"></script>
  <script>
    (() => {
      "use strict";

      const CONFIG = {
        GRAVITY: 1850,
        SHOT_POWER: 1,
        AIM_ASSIST: 0.96,
        MISS_WOBBLE: 18,
        SCORE_SENSOR_SCALE: 2.25,
        BALL_MAGNETISM: 0.18,
        SHAKE_MS: 190,
        SHAKE_INTENSITY: 7,
        PARTICLE_COUNT: 42,
        UNLOCK_THRESHOLDS: [5, 15, 30],
        COURT_INTERVAL: 12,
        MAKE_RATE: 0.9,
        HATCH_SECONDS: 3.3,
        COURT_FLASH_SECONDS: 1.4,
        SPECIAL_SHOT_INTERVAL: 4,
        SURPRISE_MIN_BASKETS: 5,
        SURPRISE_MAX_BASKETS: 8
      };

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });
      const STATE = { START: "start", PLAY: "play", HATCH: "hatch", PICKER: "picker", STICKERS: "stickers" };
      const TAU = Math.PI * 2;
      const COLORS = ["#fff275", "#ff7a90", "#6ee7b7", "#60a5fa", "#f97316", "#f0abfc"];
      const SPECIAL_SHOTS = ["rainbow", "bank", "moon", "dunk", "star", "bubble"];
      const SURPRISE_TYPES = ["crown", "parade", "sparkleHoop", "confettiRain", "starBall"];
      const SAVE_KEY = "dinoBasketballSave";
      const SAVE_VERSION = 1;
      const DINOS = [
        {
          id: "trex",
          unlockAt: 0,
          hue: 0,
          saturation: 1,
          body: "#22c55e",
          belly: "#d9f99d",
          dark: "#15803d",
          egg: "#bbf7d0",
          accessory: "tail",
          fanfare: 1,
          particles: ["#fef08a", "#86efac", "#f97316", "#38bdf8"]
        },
        {
          id: "trike",
          unlockAt: CONFIG.UNLOCK_THRESHOLDS[0],
          hue: 155,
          saturation: 1.12,
          body: "#38bdf8",
          belly: "#cffafe",
          dark: "#0369a1",
          egg: "#bae6fd",
          accessory: "horns",
          fanfare: 1.12,
          particles: ["#7dd3fc", "#fde68a", "#f0abfc", "#a7f3d0"]
        },
        {
          id: "stego",
          unlockAt: CONFIG.UNLOCK_THRESHOLDS[1],
          hue: 285,
          saturation: 1.05,
          body: "#f472b6",
          belly: "#fce7f3",
          dark: "#be185d",
          egg: "#fbcfe8",
          accessory: "plates",
          fanfare: 0.88,
          particles: ["#f9a8d4", "#fef3c7", "#fb923c", "#c4b5fd"]
        },
        {
          id: "ptero",
          unlockAt: CONFIG.UNLOCK_THRESHOLDS[2],
          hue: 225,
          saturation: 1.08,
          body: "#a78bfa",
          belly: "#ede9fe",
          dark: "#6d28d9",
          egg: "#ddd6fe",
          accessory: "wings",
          fanfare: 1.25,
          particles: ["#c4b5fd", "#93c5fd", "#fef08a", "#f0abfc"]
        }
      ];
      const COURTS = [
        { id: "jungle", unlockAt: 0, title: "Jungle", tint: "rgba(34, 197, 94, 0.04)" },
        { id: "beach", unlockAt: CONFIG.COURT_INTERVAL, title: "Beach", tint: "rgba(14, 165, 233, 0.13)" },
        { id: "volcano", unlockAt: CONFIG.COURT_INTERVAL * 2, title: "Volcano", tint: "rgba(239, 68, 68, 0.16)" },
        { id: "space", unlockAt: CONFIG.COURT_INTERVAL * 3, title: "Space", tint: "rgba(30, 41, 59, 0.2)" }
      ];
      const ASSET_DEFS = (window.DINO_ASSETS && window.DINO_ASSETS.images) || {};
      const ASSET_VERSION = (window.DINO_ASSETS && window.DINO_ASSETS.version) || "local";
      const assets = {
        ready: false,
        loaded: 0,
        failed: 0,
        total: Object.keys(ASSET_DEFS).length,
        images: {}
      };

      let width = 0;
      let height = 0;
      let dpr = 1;
      let lastTime = performance.now();
      let audioContext = null;
      let noiseBuffer = null;
      let lastTapAt = 0;
      const loadedSave = loadSave();

      const game = {
        state: STATE.START,
        score: loadedSave.score,
        unlockedDinos: loadedSave.unlockedDinos,
        selectedDino: loadedSave.selectedDino,
        court: loadedSave.court,
        streak: 0,
        time: 0,
        shakeLeft: 0,
        dinoReact: 0,
        dinoMood: "happy",
        queuedShot: false,
        autoLaunchDelay: 0,
        pendingHatchDino: null,
        hatch: null,
        courtFlash: 0,
        shotCount: 0,
        nextShotKind: null,
        nextSurpriseAt: loadedSave.score + randomInt(CONFIG.SURPRISE_MIN_BASKETS, CONFIG.SURPRISE_MAX_BASKETS),
        surprise: null,
        dinoCelebration: null,
        hoopSparkle: 0,
        pickerBounce: 0,
        uiTargets: [],
        pickerTargets: [],
        particles: [],
        particlePool: [],
        ball: {
          state: "ready",
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          r: 16,
          age: 0,
          flightTime: 1,
          intent: "make",
          scored: false,
          afterScore: 0,
          squeeze: 0,
          shotKind: "normal",
          trail: []
        }
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }

      function pick(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function defaultSave() {
        return {
          version: SAVE_VERSION,
          score: 0,
          unlockedDinos: [DINOS[0].id],
          selectedDino: DINOS[0].id,
          court: COURTS[0].id
        };
      }

      function validDinoIds() {
        return DINOS.map((dino) => dino.id);
      }

      function validCourtIds() {
        return COURTS.map((court) => court.id);
      }

      function getDinoById(id) {
        return DINOS.find((dino) => dino.id === id) || DINOS[0];
      }

      function getCourtById(id) {
        return COURTS.find((court) => court.id === id) || COURTS[0];
      }

      function getCurrentDino() {
        return getDinoById(game.selectedDino);
      }

      function getCurrentCourt() {
        return getCourtById(game.court);
      }

      function unlockedDinosForScore(score) {
        return DINOS.filter((dino) => score >= dino.unlockAt).map((dino) => dino.id);
      }

      function unlockedCourtsForScore(score) {
        return COURTS.filter((court) => score >= court.unlockAt).map((court) => court.id);
      }

      function normalizeSave(value) {
        const fallback = defaultSave();
        if (!value || typeof value !== "object") return fallback;

        const score = Math.max(0, Math.floor(Number(value.score) || 0));
        const validDinos = new Set(validDinoIds());
        const earnedDinos = new Set(unlockedDinosForScore(score));
        const storedDinos = Array.isArray(value.unlockedDinos) ? value.unlockedDinos : [];
        for (const id of storedDinos) {
          if (validDinos.has(id)) earnedDinos.add(id);
        }
        if (!earnedDinos.size) earnedDinos.add(DINOS[0].id);

        const unlockedDinos = [...earnedDinos].sort((a, b) => getDinoById(a).unlockAt - getDinoById(b).unlockAt);
        const selectedDino = unlockedDinos.includes(value.selectedDino) ? value.selectedDino : unlockedDinos[0];
        const unlockedCourts = unlockedCourtsForScore(score);
        const court = validCourtIds().includes(value.court) && unlockedCourts.includes(value.court)
          ? value.court
          : unlockedCourts[unlockedCourts.length - 1] || COURTS[0].id;

        return {
          version: SAVE_VERSION,
          score,
          unlockedDinos,
          selectedDino,
          court
        };
      }

      function loadSave() {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.has("reset")) {
            localStorage.removeItem(SAVE_KEY);
            params.delete("reset");
            const query = params.toString();
            const cleanUrl = window.location.pathname + (query ? `?${query}` : "") + window.location.hash;
            window.history.replaceState(null, "", cleanUrl);
            return defaultSave();
          }
          const raw = localStorage.getItem(SAVE_KEY);
          return normalizeSave(raw ? JSON.parse(raw) : null);
        } catch (error) {
          return defaultSave();
        }
      }

      function saveGame() {
        try {
          const payload = {
            version: SAVE_VERSION,
            score: game.score,
            unlockedDinos: game.unlockedDinos,
            selectedDino: game.selectedDino,
            court: game.court
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
        } catch (error) {
          // localStorage can be unavailable in private modes. The game still plays.
        }
      }

      function versionedAssetSrc(src) {
        const separator = src.includes("?") ? "&" : "?";
        return `${src}${separator}v=${encodeURIComponent(ASSET_VERSION)}`;
      }

      function loadAssets() {
        const entries = Object.entries(ASSET_DEFS);
        if (!entries.length) {
          assets.ready = true;
          return Promise.resolve();
        }

        return Promise.all(entries.map(([id, def]) => new Promise((resolve) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => {
            assets.images[id] = { ...def, image, loaded: true };
            assets.loaded += 1;
            resolve();
          };
          image.onerror = () => {
            assets.failed += 1;
            resolve();
          };
          image.src = versionedAssetSrc(def.src);
        }))).then(() => {
          assets.ready = true;
        });
      }

      function getAsset(id) {
        if (!assets.ready) return null;
        const asset = assets.images[id];
        return asset && asset.loaded ? asset : null;
      }

      function getPoseForMood(mood, happyActive) {
        if (mood === "launch") return "launch";
        if (mood === "shrug") return "shrug";
        if (happyActive) return "happy";
        return "idle";
      }

      function getDinoSpriteChoice(dino, pose) {
        const specificId = `dino.${dino.id}.${pose}`;
        if (getAsset(specificId)) return { id: specificId, specific: true };
        return { id: `dino.${pose}`, specific: false };
      }

      function drawSprite(assetId, x, y, logicalWidth, options = {}) {
        const asset = getAsset(assetId);
        if (!asset || logicalWidth <= 0) return false;

        const anchorX = options.anchorX ?? asset.anchorX ?? 0.5;
        const anchorY = options.anchorY ?? asset.anchorY ?? 0.5;
        const logicalHeight = options.logicalHeight ?? logicalWidth * (asset.height / asset.width);
        const alpha = options.alpha ?? 1;
        const scaleX = options.scaleX ?? 1;
        const scaleY = options.scaleY ?? 1;
        const rotation = options.rotation ?? 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.globalAlpha *= alpha;
        ctx.scale(scaleX, scaleY);
        ctx.drawImage(
          asset.image,
          -logicalWidth * anchorX,
          -logicalHeight * anchorY,
          logicalWidth,
          logicalHeight
        );
        ctx.restore();
        return true;
      }

      function drawCoverImage(assetId, focusX = 0.5, focusY = 0.5) {
        const asset = getAsset(assetId);
        if (!asset) return false;

        const scale = Math.max(width / asset.width, height / asset.height);
        const drawW = asset.width * scale;
        const drawH = asset.height * scale;
        const x = (width - drawW) * focusX;
        const y = (height - drawH) * focusY;
        ctx.drawImage(asset.image, x, y, drawW, drawH);
        return true;
      }

      function getViewportSize() {
        const viewport = window.visualViewport;
        return {
          w: Math.max(1, Math.round(viewport ? viewport.width : window.innerWidth)),
          h: Math.max(1, Math.round(viewport ? viewport.height : window.innerHeight))
        };
      }

      function readSafeInset(name) {
        const raw = getComputedStyle(document.documentElement).getPropertyValue(name);
        const value = parseFloat(raw);
        return Number.isFinite(value) ? value : 0;
      }

      function safeInsets() {
        return {
          top: readSafeInset("--safe-top"),
          right: readSafeInset("--safe-right"),
          bottom: readSafeInset("--safe-bottom"),
          left: readSafeInset("--safe-left")
        };
      }

      function resizeCanvas() {
        const size = getViewportSize();
        width = size.w;
        height = size.h;
        dpr = clamp(window.devicePixelRatio || 1, 1, 3);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        resetReadyBall();
      }

      function getLayout() {
        const safe = safeInsets();
        const minSide = Math.min(width, height);
        const bottomPad = clamp(height * 0.11, 48, 96) + safe.bottom * 0.35;
        const groundY = height - bottomPad;
        const dinoSize = clamp(minSide * 0.19, 62, 96);
        const dinoX = width < height ? width * 0.24 : width * 0.18;
        const hoopX = width < height ? width * 0.76 : width * 0.72;
        const hoopY = clamp(height * 0.29, 108 + safe.top * 0.25, groundY - dinoSize * 1.8);
        const rimR = clamp(minSide * 0.055, 21, 34);
        const ballR = clamp(minSide * 0.035, 13, 21);
        return {
          safe,
          minSide,
          groundY,
          dino: { x: dinoX, y: groundY, size: dinoSize },
          hand: { x: dinoX + dinoSize * 0.38, y: groundY - dinoSize * 0.57 },
          hoop: {
            x: hoopX,
            y: hoopY,
            rimR,
            sensorR: rimR * CONFIG.SCORE_SENSOR_SCALE,
            poleX: hoopX + rimR * 1.6
          },
          ballR
        };
      }

      function resetReadyBall() {
        if (!width || !height || game.ball.state !== "ready") return;
        const layout = getLayout();
        game.ball.x = layout.hand.x;
        game.ball.y = layout.hand.y;
        game.ball.r = layout.ballR;
        game.ball.vx = 0;
        game.ball.vy = 0;
        game.ball.age = 0;
        game.ball.scored = false;
        game.ball.afterScore = 0;
        game.ball.squeeze = 0;
        game.ball.shotKind = "normal";
        game.ball.trail.length = 0;
      }

      function ensureAudio() {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        if (!audioContext) {
          audioContext = new AudioCtor();
        }
        if (audioContext.state !== "running") {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      }

      function makeNoiseBuffer(ctxRef) {
        if (noiseBuffer) return noiseBuffer;
        const length = Math.floor(ctxRef.sampleRate * 0.28);
        const buffer = ctxRef.createBuffer(1, length, ctxRef.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          const fade = 1 - i / length;
          data[i] = (Math.random() * 2 - 1) * fade;
        }
        noiseBuffer = buffer;
        return buffer;
      }

      function playTone({ type = "sine", start = 440, end = 440, duration = 0.12, gain = 0.08 }) {
        const ctxRef = ensureAudio();
        if (!ctxRef) return;
        const now = ctxRef.currentTime;
        const osc = ctxRef.createOscillator();
        const amp = ctxRef.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(start * rand(0.96, 1.04), now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, end * rand(0.96, 1.04)), now + duration);
        amp.gain.setValueAtTime(0.0001, now);
        amp.gain.exponentialRampToValueAtTime(gain, now + 0.012);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(amp).connect(ctxRef.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      function playTap() {
        playTone({ type: "triangle", start: 260, end: 410, duration: 0.08, gain: 0.045 });
      }

      function playMiss() {
        playTone({ type: "sine", start: 240, end: 150, duration: 0.18, gain: 0.035 });
      }

      function playSwish() {
        const ctxRef = ensureAudio();
        if (!ctxRef) return;
        const now = ctxRef.currentTime;
        const source = ctxRef.createBufferSource();
        const filter = ctxRef.createBiquadFilter();
        const amp = ctxRef.createGain();
        source.buffer = makeNoiseBuffer(ctxRef);
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(2400, now + 0.18);
        filter.Q.setValueAtTime(1.2, now);
        amp.gain.setValueAtTime(0.0001, now);
        amp.gain.exponentialRampToValueAtTime(0.06, now + 0.025);
        amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        source.connect(filter).connect(amp).connect(ctxRef.destination);
        source.start(now);
        source.stop(now + 0.24);
        playTone({ type: "sine", start: 660, end: 920, duration: 0.12, gain: 0.025 });
      }

      function playDinoCheer(dino) {
        const pitch = dino.fanfare || 1;
        window.setTimeout(() => {
          playTone({ type: "square", start: 160 * pitch, end: 115 * pitch, duration: 0.11, gain: 0.024 });
        }, 80);
      }

      function playFanfare(dino) {
        const pitch = dino.fanfare || 1;
        playTone({ type: "triangle", start: 392 * pitch, end: 523 * pitch, duration: 0.16, gain: 0.06 });
        window.setTimeout(() => playTone({ type: "triangle", start: 523 * pitch, end: 659 * pitch, duration: 0.16, gain: 0.06 }), 135);
        window.setTimeout(() => playTone({ type: "sine", start: 659 * pitch, end: 988 * pitch, duration: 0.28, gain: 0.075 }), 275);
        window.setTimeout(() => playDinoCheer(dino), 520);
      }

      function getCourtJuice(courtId = game.court) {
        if (courtId === "beach") {
          return { palette: ["#38bdf8", "#fef3c7", "#fb7185", "#facc15"], shape: "shell" };
        }
        if (courtId === "volcano") {
          return { palette: ["#fb923c", "#f97316", "#fef08a", "#ef4444"], shape: "spark" };
        }
        if (courtId === "space") {
          return { palette: ["#c4b5fd", "#93c5fd", "#fef08a", "#f0abfc"], shape: "planet" };
        }
        return { palette: ["#86efac", "#fef08a", "#22c55e", "#38bdf8"], shape: "leaf" };
      }

      function chooseShotKind() {
        if (game.nextShotKind) {
          const forced = game.nextShotKind;
          game.nextShotKind = null;
          return forced;
        }

        if (game.shotCount > 0 && game.shotCount % CONFIG.SPECIAL_SHOT_INTERVAL === 0) {
          return SPECIAL_SHOTS[(Math.floor(game.shotCount / CONFIG.SPECIAL_SHOT_INTERVAL) - 1) % SPECIAL_SHOTS.length];
        }

        return "normal";
      }

      function launchShot() {
        const ball = game.ball;
        if (ball.state !== "ready") {
          game.queuedShot = true;
          return;
        }

        const layout = getLayout();
        const hoop = layout.hoop;
        const startX = layout.hand.x;
        const startY = layout.hand.y;
        game.shotCount += 1;
        const shotKind = chooseShotKind();
        const willMake = Math.random() < CONFIG.MAKE_RATE;
        const assistedScatter = CONFIG.MISS_WOBBLE * (1 - CONFIG.AIM_ASSIST + 0.18);
        let targetX = hoop.x + rand(-assistedScatter, assistedScatter);
        let targetY = hoop.y + rand(-assistedScatter * 0.55, assistedScatter * 0.55);

        if (!willMake) {
          const missSide = Math.random() < 0.5 ? -1 : 1;
          targetX = hoop.x + missSide * hoop.sensorR * rand(1.15, 1.45);
          targetY = hoop.y + rand(-hoop.rimR * 0.9, hoop.rimR * 0.65);
        }

        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.hypot(dx, dy);
        let flightTime = clamp(distance / (520 * CONFIG.SHOT_POWER), 0.78, 1.08);
        if (shotKind === "moon") flightTime *= 1.16;
        if (shotKind === "dunk") flightTime *= 0.82;

        ball.state = "flying";
        ball.x = startX;
        ball.y = startY;
        ball.r = layout.ballR;
        ball.vx = dx / flightTime;
        ball.vy = (dy - 0.5 * CONFIG.GRAVITY * flightTime * flightTime) / flightTime;
        ball.age = 0;
        ball.flightTime = flightTime;
        ball.intent = willMake ? "make" : "miss";
        ball.scored = false;
        ball.afterScore = 0;
        ball.squeeze = 1;
        ball.shotKind = shotKind;
        ball.trail.length = 0;

        game.dinoReact = 0.18;
        game.dinoMood = "launch";
        playTap();
      }

      function handleProgressionAfterScore() {
        const previousDinos = new Set(game.unlockedDinos);
        const earnedDinos = unlockedDinosForScore(game.score);
        let newlyUnlockedDino = null;

        for (const id of earnedDinos) {
          if (!previousDinos.has(id)) {
            newlyUnlockedDino = id;
            break;
          }
        }

        game.unlockedDinos = earnedDinos;
        if (newlyUnlockedDino) {
          game.selectedDino = newlyUnlockedDino;
          game.pendingHatchDino = newlyUnlockedDino;
        }

        const courtsBefore = unlockedCourtsForScore(Math.max(0, game.score - 1));
        const courtsNow = unlockedCourtsForScore(game.score);
        if (courtsNow.length > courtsBefore.length) {
          game.court = courtsNow[courtsNow.length - 1];
          game.courtFlash = CONFIG.COURT_FLASH_SECONDS;
          const juice = getCourtJuice(game.court);
          spawnParticles(width * 0.5, height * 0.34, Math.floor(CONFIG.PARTICLE_COUNT * 0.8), juice.palette, juice.shape);
        }

        saveGame();
      }

      function startHatch(dinoId) {
        const dino = getDinoById(dinoId);
        game.state = STATE.HATCH;
        game.hatch = {
          time: 0,
          duration: CONFIG.HATCH_SECONDS,
          dinoId,
          taps: 0
        };
        game.queuedShot = false;
        game.autoLaunchDelay = 0;
        game.ball.state = "ready";
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        spawnParticles(width * 0.5, height * 0.42, CONFIG.PARTICLE_COUNT + 18, dino.particles, "star");
        playFanfare(dino);
      }

      function endHatch() {
        game.state = STATE.PLAY;
        game.hatch = null;
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        resetReadyBall();
      }

      function cycleCourt() {
        const unlocked = unlockedCourtsForScore(game.score);
        if (unlocked.length < 2) return;
        const currentIndex = Math.max(0, unlocked.indexOf(game.court));
        game.court = unlocked[(currentIndex + 1) % unlocked.length];
        game.courtFlash = CONFIG.COURT_FLASH_SECONDS * 0.8;
        const juice = getCourtJuice(game.court);
        spawnParticles(width * 0.5, height * 0.32, Math.floor(CONFIG.PARTICLE_COUNT * 0.55), juice.palette, juice.shape);
        saveGame();
      }

      function startSurprise(type = pick(SURPRISE_TYPES)) {
        game.surprise = {
          type,
          time: 0,
          duration: type === "parade" ? 3.8 : 2.8
        };
        if (type === "starBall") game.nextShotKind = "star";
        if (type === "sparkleHoop") game.hoopSparkle = 2.8;
      }

      function maybeStartSurprise(layout) {
        if (game.score < game.nextSurpriseAt) return;
        const type = pick(SURPRISE_TYPES);
        game.nextSurpriseAt = game.score + randomInt(CONFIG.SURPRISE_MIN_BASKETS, CONFIG.SURPRISE_MAX_BASKETS);
        startSurprise(type);
        const juice = getCourtJuice();
        spawnParticles(width * 0.5, height * 0.22, CONFIG.PARTICLE_COUNT, juice.palette, juice.shape);
        if (type === "confettiRain") {
          for (let i = 0; i < 18; i += 1) {
            spawnParticles(rand(width * 0.12, width * 0.88), rand(20, height * 0.22), 2, juice.palette, juice.shape);
          }
        }
        if (type === "parade") {
          spawnParticles(layout.dino.x, layout.dino.y - layout.dino.size * 0.8, CONFIG.PARTICLE_COUNT, juice.palette, juice.shape);
        }
      }

      function triggerDinoPersonality(dino, layout) {
        game.dinoCelebration = {
          type: dino.id,
          time: 0,
          duration: 1.1
        };
        if (dino.id === "trex") {
          spawnParticles(layout.dino.x, layout.dino.y - 8, 18, ["#fde68a", "#d9f99d", "#f97316"], "stomp");
        } else if (dino.id === "trike") {
          spawnParticles(layout.dino.x + layout.dino.size * 0.45, layout.dino.y - layout.dino.size * 0.85, 22, dino.particles, "spark");
        } else if (dino.id === "stego") {
          spawnParticles(layout.dino.x - layout.dino.size * 0.35, layout.dino.y - layout.dino.size * 0.48, 24, dino.particles, "star");
        } else if (dino.id === "ptero") {
          spawnParticles(layout.dino.x, layout.dino.y - layout.dino.size * 1.05, 28, dino.particles, "planet");
        }
      }

      function scoreBasket(forceCenter) {
        const ball = game.ball;
        if (ball.scored) return;
        const layout = getLayout();
        if (forceCenter) {
          ball.x = layout.hoop.x;
          ball.y = layout.hoop.y + layout.hoop.rimR * 0.12;
        }
        ball.scored = true;
        ball.intent = "scored";
        ball.afterScore = 0;
        ball.vx = rand(-35, 35);
        ball.vy = 420;
        ball.squeeze = 1;
        game.score += 1;
        game.streak += 1;
        game.shakeLeft = CONFIG.SHAKE_MS / 1000;
        game.dinoReact = 0.58;
        game.dinoMood = "happy";
        const dino = getCurrentDino();
        const courtJuice = getCourtJuice();
        const shotBonus = ball.shotKind === "normal" ? 0 : 16;
        spawnParticles(layout.hoop.x, layout.hoop.y, CONFIG.PARTICLE_COUNT + Math.min(game.streak, 6) * 3 + shotBonus, courtJuice.palette, courtJuice.shape);
        spawnParticles(layout.hoop.x, layout.hoop.y, 14, dino.particles, ball.shotKind === "bank" ? "spark" : "star");
        if (ball.shotKind === "bank") game.hoopSparkle = 1.2;
        if (ball.shotKind === "dunk") game.shakeLeft = Math.max(game.shakeLeft, 0.28);
        playSwish();
        playDinoCheer(dino);
        triggerDinoPersonality(dino, layout);
        maybeStartSurprise(layout);
        handleProgressionAfterScore();
      }

      function finishMiss() {
        const ball = game.ball;
        if (ball.state === "ready") return;
        ball.state = "ready";
        ball.scored = false;
        ball.squeeze = 1;
        game.streak = 0;
        game.dinoReact = 0.34;
        game.dinoMood = "shrug";
        playMiss();
        resetReadyBall();
        if (game.queuedShot) {
          game.queuedShot = false;
          game.autoLaunchDelay = 0.08;
        }
      }

      function finishMake() {
        const ball = game.ball;
        ball.state = "ready";
        if (game.pendingHatchDino) {
          const dinoId = game.pendingHatchDino;
          game.pendingHatchDino = null;
          startHatch(dinoId);
          return;
        }
        resetReadyBall();
        if (game.queuedShot) {
          game.queuedShot = false;
          game.autoLaunchDelay = 0.08;
        }
      }

      function spawnParticles(x, y, count, palette = null, shape = null) {
        const colors = palette && palette.length ? palette : COLORS;
        for (let i = 0; i < count; i += 1) {
          const p = game.particlePool.pop() || {};
          const angle = rand(-Math.PI, 0);
          const speed = rand(120, 430);
          p.x = x;
          p.y = y;
          p.vx = Math.cos(angle) * speed + rand(-60, 60);
          p.vy = Math.sin(angle) * speed - rand(20, 140);
          p.life = rand(0.55, 1.05);
          p.maxLife = p.life;
          p.size = rand(4, 9);
          p.spin = rand(-7, 7);
          p.rot = rand(0, TAU);
          p.color = colors[(Math.random() * colors.length) | 0];
          p.shape = shape || (Math.random() < 0.35 ? "star" : "confetti");
          game.particles.push(p);
        }
      }

      function updateParticles(dt) {
        for (let i = game.particles.length - 1; i >= 0; i -= 1) {
          const p = game.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            game.particles.splice(i, 1);
            game.particlePool.push(p);
            continue;
          }
          p.vy += CONFIG.GRAVITY * 0.38 * dt;
          p.vx *= 0.992;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.spin * dt;
        }
      }

      function updateBall(dt) {
        const ball = game.ball;
        const layout = getLayout();
        if (ball.state === "ready") {
          ball.r = layout.ballR;
          ball.x = layout.hand.x;
          ball.y = layout.hand.y + Math.sin(game.time * 4.5) * 2;
          ball.squeeze = Math.max(0, ball.squeeze - dt * 8);
          return;
        }

        ball.age += dt;
        ball.squeeze = Math.max(0, ball.squeeze - dt * 7);

        if (!ball.scored) {
          const hoop = layout.hoop;
          const dx = hoop.x - ball.x;
          const dy = hoop.y - ball.y;
          const dist = Math.hypot(dx, dy);
          if (ball.intent === "make" && ball.age > ball.flightTime * 0.42 && dist < hoop.sensorR * 3.2) {
            const pull = CONFIG.BALL_MAGNETISM * dt * 16;
            ball.vx += dx * pull;
            ball.vy += dy * pull;
          }
        }

        ball.vy += CONFIG.GRAVITY * dt;
        if (ball.shotKind !== "normal") {
          ball.trail.push({ x: ball.x, y: ball.y, age: 0, kind: ball.shotKind });
          if (ball.trail.length > 28) ball.trail.shift();
        }
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        for (const point of ball.trail) point.age += dt;

        const hoop = layout.hoop;
        const sensorDist = Math.hypot(ball.x - hoop.x, ball.y - hoop.y);
        if (!ball.scored && (sensorDist <= hoop.sensorR || (ball.intent === "make" && ball.age >= ball.flightTime * 0.98))) {
          scoreBasket(ball.intent === "make");
        }

        if (ball.scored) {
          ball.afterScore += dt;
          if (ball.y > layout.groundY - ball.r) {
            ball.y = layout.groundY - ball.r;
            ball.vy = -Math.abs(ball.vy) * 0.32;
            ball.vx *= 0.7;
            ball.squeeze = 1;
          }
          if (ball.afterScore > 0.62) finishMake();
          return;
        }

        if (ball.y > layout.groundY - ball.r || ball.x < -ball.r * 3 || ball.x > width + ball.r * 3) {
          finishMiss();
        }
      }

      function update(dt) {
        game.time += dt;
        game.shakeLeft = Math.max(0, game.shakeLeft - dt);
        game.dinoReact = Math.max(0, game.dinoReact - dt);
        game.courtFlash = Math.max(0, game.courtFlash - dt);
        game.hoopSparkle = Math.max(0, game.hoopSparkle - dt);
        game.pickerBounce = Math.max(0, game.pickerBounce - dt);
        if (game.dinoCelebration) {
          game.dinoCelebration.time += dt;
          if (game.dinoCelebration.time >= game.dinoCelebration.duration) game.dinoCelebration = null;
        }
        if (game.surprise) {
          game.surprise.time += dt;
          if (game.surprise.type === "confettiRain" && Math.random() < dt * 7) {
            const juice = getCourtJuice();
            spawnParticles(rand(width * 0.1, width * 0.9), rand(16, height * 0.18), 3, juice.palette, juice.shape);
          }
          if (game.surprise.time >= game.surprise.duration) game.surprise = null;
        }
        updateParticles(dt);

        if (game.state === STATE.PLAY) {
          if (game.autoLaunchDelay > 0) {
            game.autoLaunchDelay -= dt;
            if (game.autoLaunchDelay <= 0) launchShot();
          }
          updateBall(dt);
        } else if (game.state === STATE.HATCH && game.hatch) {
          game.hatch.time += dt;
          if (game.hatch.time >= game.hatch.duration) endHatch();
        }
      }

      function roundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function fillRoundedRect(x, y, w, h, r, color) {
        ctx.fillStyle = color;
        roundedRect(x, y, w, h, r);
        ctx.fill();
      }

      function drawProceduralBackground(layout) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#7dd3fc");
        sky.addColorStop(0.6, "#b9f3ff");
        sky.addColorStop(1, "#d9f99d");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#ffe66d";
        ctx.beginPath();
        ctx.arc(width * 0.16, height * 0.14, clamp(layout.minSide * 0.09, 34, 64), 0, TAU);
        ctx.fill();

        drawCloud(width * 0.64, height * 0.15, layout.minSide * 0.08, 0.72);
        drawCloud(width * 0.28, height * 0.25, layout.minSide * 0.07, 0.5);

        const groundY = layout.groundY;
        ctx.fillStyle = "#55c95a";
        ctx.fillRect(0, groundY, width, height - groundY);
        ctx.fillStyle = "#6bd16f";
        for (let x = -20; x < width + 20; x += 38) {
          ctx.beginPath();
          ctx.ellipse(x, groundY + 12, 34, 8, 0, 0, TAU);
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(width * 0.52, groundY + layout.minSide * 0.15, layout.minSide * 0.28, Math.PI, TAU);
        ctx.stroke();
      }

      function drawSpaceBackground(layout) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#111827");
        sky.addColorStop(0.55, "#312e81");
        sky.addColorStop(1, "#4c1d95");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        for (let i = 0; i < 52; i += 1) {
          const x = (i * 73 + 19) % Math.max(1, width);
          const y = (i * 41 + 27) % Math.max(1, layout.groundY - 20);
          const r = 1 + (i % 3) * 0.55;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }

        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(width * 0.18, height * 0.17, clamp(layout.minSide * 0.06, 24, 42), 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(17, 24, 39, 0.35)";
        ctx.beginPath();
        ctx.arc(width * 0.2, height * 0.145, clamp(layout.minSide * 0.06, 24, 42), 0, TAU);
        ctx.fill();

        ctx.fillStyle = "#6d28d9";
        ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
        ctx.fillStyle = "#8b5cf6";
        for (let x = -20; x < width + 20; x += 48) {
          ctx.beginPath();
          ctx.ellipse(x, layout.groundY + 12, 38, 9, 0, 0, TAU);
          ctx.fill();
        }
      }

      function drawCourtOverlay(court, layout) {
        if (court.tint) {
          ctx.fillStyle = court.tint;
          ctx.fillRect(0, 0, width, height);
        }

        if (court.id === "beach") {
          ctx.fillStyle = "rgba(14, 165, 233, 0.28)";
          ctx.fillRect(0, layout.groundY - layout.minSide * 0.18, width, layout.minSide * 0.24);
          ctx.fillStyle = "rgba(253, 230, 138, 0.75)";
          ctx.fillRect(0, layout.groundY, width, height - layout.groundY);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
          ctx.lineWidth = 3;
          for (let y = layout.groundY - layout.minSide * 0.16; y < layout.groundY - 8; y += 18) {
            ctx.beginPath();
            for (let x = -20; x <= width + 20; x += 18) {
              const waveY = y + Math.sin((x + game.time * 65) * 0.04) * 3;
              if (x === -20) ctx.moveTo(x, waveY);
              else ctx.lineTo(x, waveY);
            }
            ctx.stroke();
          }
        } else if (court.id === "jungle") {
          ctx.fillStyle = "rgba(21, 128, 61, 0.24)";
          for (let i = 0; i < 8; i += 1) {
            const x = (i * 113 + 29) % Math.max(1, width);
            const y = layout.groundY - 18 - (i % 3) * 22;
            ctx.beginPath();
            ctx.ellipse(x, y, 24, 8, (i % 2 ? -0.35 : 0.35), 0, TAU);
            ctx.fill();
          }
        }
      }

      function drawBackground(layout) {
        const court = getCurrentCourt();
        if (court.id === "space") {
          drawSpaceBackground(layout);
          return;
        }

        const orientation = width >= height ? "landscape" : "portrait";
        const courtAssetId = `background.${court.id}.${orientation}`;
        const hasCourtAsset = Boolean(ASSET_DEFS[courtAssetId]);
        const assetId = hasCourtAsset ? courtAssetId : `background.${orientation}`;
        if (!drawCoverImage(assetId)) drawProceduralBackground(layout);
        if (!hasCourtAsset) drawCourtOverlay(court, layout);
      }

      function drawCloud(x, y, size, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x - size * 0.7, y + size * 0.12, size * 0.48, 0, TAU);
        ctx.arc(x - size * 0.2, y - size * 0.05, size * 0.62, 0, TAU);
        ctx.arc(x + size * 0.45, y + size * 0.08, size * 0.5, 0, TAU);
        ctx.rect(x - size * 0.8, y, size * 1.55, size * 0.45);
        ctx.fill();
        ctx.restore();
      }

      function drawProceduralHoop(layout) {
        const hoop = layout.hoop;
        const poleTop = hoop.y - hoop.rimR * 1.4;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#5b6b7a";
        ctx.lineWidth = Math.max(5, hoop.rimR * 0.22);
        ctx.beginPath();
        ctx.moveTo(hoop.poleX, poleTop);
        ctx.lineTo(hoop.poleX, layout.groundY + 6);
        ctx.stroke();

        fillRoundedRect(hoop.x + hoop.rimR * 0.62, hoop.y - hoop.rimR * 1.42, hoop.rimR * 1.8, hoop.rimR * 1.35, 8, "#f8fafc");
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 3;
        roundedRect(hoop.x + hoop.rimR * 0.62, hoop.y - hoop.rimR * 1.42, hoop.rimR * 1.8, hoop.rimR * 1.35, 8);
        ctx.stroke();

        ctx.strokeStyle = "#f97316";
        ctx.lineWidth = Math.max(5, hoop.rimR * 0.18);
        ctx.beginPath();
        ctx.ellipse(hoop.x, hoop.y, hoop.rimR, hoop.rimR * 0.32, 0, 0, TAU);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i += 1) {
          const startX = hoop.x + i * hoop.rimR * 0.33;
          ctx.beginPath();
          ctx.moveTo(startX, hoop.y + hoop.rimR * 0.16);
          ctx.lineTo(hoop.x + i * hoop.rimR * 0.18, hoop.y + hoop.rimR * 1.15);
          ctx.stroke();
        }
      }

      function drawHoopBack(layout) {
        if (!getAsset("prop.hoopBack") || !getAsset("prop.hoopFront")) {
          drawProceduralHoop(layout);
          return;
        }
        const hoop = layout.hoop;
        const asset = ASSET_DEFS["prop.hoopBack"];
        const widthScale = asset ? asset.logicalWidthScale : 5.4;
        drawHoopPoleExtension(layout);
        drawSprite("prop.hoopBack", hoop.x, hoop.y, hoop.rimR * widthScale);
      }

      function drawHoopPoleExtension(layout) {
        const hoop = layout.hoop;
        const topY = hoop.y + hoop.rimR * 1.45;
        const bottomY = layout.groundY + 8;
        if (bottomY <= topY) return;

        const x = hoop.x;
        const poleW = Math.max(12, hoop.rimR * 0.54);
        ctx.save();
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(71, 85, 105, 0.38)";
        ctx.lineWidth = poleW + 7;
        ctx.beginPath();
        ctx.moveTo(x + 2, topY + 2);
        ctx.lineTo(x + 2, bottomY);
        ctx.stroke();

        ctx.strokeStyle = "#aeb8c3";
        ctx.lineWidth = poleW;
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.lineTo(x, bottomY);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
        ctx.lineWidth = Math.max(3, poleW * 0.22);
        ctx.beginPath();
        ctx.moveTo(x - poleW * 0.22, topY + 6);
        ctx.lineTo(x - poleW * 0.22, bottomY - 8);
        ctx.stroke();

        fillRoundedRect(x - poleW * 1.15, layout.groundY - 2, poleW * 2.3, poleW * 0.82, poleW * 0.32, "#8f9aa6");
        ctx.restore();
      }

      function drawHoopFront(layout) {
        if (!getAsset("prop.hoopBack") || !getAsset("prop.hoopFront")) return;
        const hoop = layout.hoop;
        const asset = ASSET_DEFS["prop.hoopFront"];
        const widthScale = asset ? asset.logicalWidthScale : 3.05;
        drawSprite("prop.hoopFront", hoop.x, hoop.y, hoop.rimR * widthScale);
      }

      function drawHoop(layout) {
        drawHoopBack(layout);
        drawHoopFront(layout);
      }

      function drawDinoAccessory(dino, size, layer) {
        ctx.save();
        ctx.lineJoin = "round";
        if (dino.accessory === "wings" && layer === "behind") {
          ctx.fillStyle = dino.dark;
          ctx.globalAlpha *= 0.45;
          ctx.beginPath();
          ctx.moveTo(-size * 0.16, -size * 0.54);
          ctx.quadraticCurveTo(-size * 0.72, -size * 0.82, -size * 0.76, -size * 0.28);
          ctx.quadraticCurveTo(-size * 0.48, -size * 0.42, -size * 0.16, -size * 0.38);
          ctx.closePath();
          ctx.fill();
        }

        if (layer === "front") {
          if (dino.accessory === "horns") {
            ctx.fillStyle = "#fef3c7";
            ctx.strokeStyle = "#92400e";
            ctx.lineWidth = Math.max(2, size * 0.018);
            const hornPoints = [
              [size * 0.36, -size * 0.9, size * 0.2, -size * 1.08, size * 0.43, -size * 0.82],
              [size * 0.55, -size * 0.84, size * 0.76, -size * 0.96, size * 0.58, -size * 0.72]
            ];
            for (const points of hornPoints) {
              ctx.beginPath();
              ctx.moveTo(points[0], points[1]);
              ctx.lineTo(points[2], points[3]);
              ctx.lineTo(points[4], points[5]);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          } else if (dino.accessory === "plates") {
            ctx.fillStyle = "#fef08a";
            ctx.strokeStyle = dino.dark;
            ctx.lineWidth = Math.max(2, size * 0.018);
            for (let i = 0; i < 5; i += 1) {
              const x = -size * 0.42 + i * size * 0.16;
              const y = -size * (0.67 + Math.sin(i) * 0.04);
              ctx.beginPath();
              ctx.moveTo(x, y);
              ctx.lineTo(x + size * 0.08, y - size * 0.18);
              ctx.lineTo(x + size * 0.17, y);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      function drawProceduralDino(x, groundY, size, mood, dino = getCurrentDino()) {
        const react = game.dinoReact;
        const happyHop = mood === "happy" ? Math.sin((react / 0.58) * Math.PI) * -size * 0.16 : 0;
        const launchLean = mood === "launch" ? react / 0.18 : 0;
        const shrug = mood === "shrug" ? react / 0.34 : 0;
        const squash = mood === "happy" ? Math.sin((react / 0.58) * Math.PI) * 0.07 : 0;

        ctx.save();
        ctx.translate(x, groundY + happyHop);
        ctx.rotate(-launchLean * 0.08 + shrug * 0.04);
        ctx.scale(1 + squash, 1 - squash);

        drawDinoAccessory(dino, size, "behind");

        ctx.fillStyle = dino.body;
        ctx.beginPath();
        ctx.moveTo(-size * 0.48, -size * 0.38);
        ctx.lineTo(-size * 0.88, -size * 0.55);
        ctx.lineTo(-size * 0.46, -size * 0.18);
        ctx.closePath();
        ctx.fill();

        fillRoundedRect(-size * 0.48, -size * 0.62, size * 0.82, size * 0.44, size * 0.18, dino.body);
        fillRoundedRect(size * 0.12, -size * 0.93, size * 0.46, size * 0.34, size * 0.14, dino.body);
        fillRoundedRect(size * 0.43, -size * 0.86, size * 0.28, size * 0.18, size * 0.08, dino.body);

        ctx.fillStyle = dino.belly;
        ctx.beginPath();
        ctx.ellipse(-size * 0.08, -size * 0.43, size * 0.26, size * 0.13, 0, 0, TAU);
        ctx.fill();

        fillRoundedRect(-size * 0.34, -size * 0.21, size * 0.17, size * 0.22, size * 0.07, dino.dark);
        fillRoundedRect(size * 0.04, -size * 0.21, size * 0.17, size * 0.22, size * 0.07, dino.dark);
        fillRoundedRect(-size * 0.39, -size * 0.03, size * 0.24, size * 0.07, size * 0.04, "#14532d");
        fillRoundedRect(size * 0.01, -size * 0.03, size * 0.24, size * 0.07, size * 0.04, "#14532d");

        ctx.strokeStyle = dino.dark;
        ctx.lineWidth = Math.max(4, size * 0.055);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(size * 0.23, -size * 0.51);
        ctx.lineTo(size * (0.43 + shrug * 0.06), -size * (0.43 + shrug * 0.1));
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(size * 0.47, -size * 0.81, size * 0.035, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(2, size * 0.025);
        ctx.beginPath();
        ctx.arc(size * 0.57, -size * 0.76, size * 0.07, 0.15, Math.PI * 0.78);
        ctx.stroke();

        drawDinoAccessory(dino, size, "front");

        ctx.restore();
      }

      function getDinoSpriteId(dino, mood, happyActive) {
        let pose = "idle";
        if (mood === "launch") pose = "launch";
        else if (mood === "shrug") pose = "shrug";
        else if (happyActive) pose = "happy";

        const specific = `dino.${dino.id}.${pose}`;
        if (ASSET_DEFS[specific]) return specific;
        const idle = `dino.${dino.id}.idle`;
        if (ASSET_DEFS[idle]) return idle;
        if (pose === "happy" && ASSET_DEFS["dino.happy"]) return "dino.happy";
        if (pose === "launch" && ASSET_DEFS["dino.launch"]) return "dino.launch";
        if (pose === "shrug" && ASSET_DEFS["dino.shrug"]) return "dino.shrug";
        return "dino.idle";
      }

      function drawDinoForDino(dino, x, groundY, size, mood) {
        const react = game.dinoReact;
        const happyActive = mood === "happy" && (react > 0.01 || game.state === STATE.START);
        const happyHop = happyActive ? Math.sin((react / 0.58) * Math.PI) * -size * 0.16 : 0;
        const launchLean = mood === "launch" ? react / 0.18 : 0;
        const shrug = mood === "shrug" ? react / 0.34 : 0;
        const squash = happyActive ? Math.sin((react / 0.58) * Math.PI) * 0.07 : 0;
        const spriteId = getDinoSpriteId(dino, mood, happyActive);
        const specificSprite = spriteId.startsWith(`dino.${dino.id}.`);
        const asset = ASSET_DEFS[spriteId];
        const widthScale = asset ? asset.logicalWidthScale : 1.5;
        ctx.save();
        ctx.translate(x, groundY + happyHop);
        ctx.rotate(-launchLean * 0.08 + shrug * 0.04);
        ctx.scale(1 + squash, 1 - squash);
        if (!specificSprite) drawDinoAccessory(dino, size, "behind");
        ctx.filter = specificSprite ? "none" : `hue-rotate(${dino.hue || 0}deg) saturate(${dino.saturation || 1})`;
        const drewSprite = drawSprite(spriteId, 0, 0, size * widthScale);
        ctx.filter = "none";
        if (drewSprite && !specificSprite) drawDinoAccessory(dino, size, "front");
        ctx.restore();

        if (!drewSprite) drawProceduralDino(x, groundY, size, mood, dino);
      }

      function drawDino(x, groundY, size, mood) {
        drawDinoForDino(getCurrentDino(), x, groundY, size, mood);
      }

      function drawShotTrail(ball) {
        if (!ball.trail || ball.trail.length < 2 || ball.shotKind === "normal") return;
        ctx.save();
        ctx.lineCap = "round";
        for (let i = 0; i < ball.trail.length - 1; i += 1) {
          const point = ball.trail[i];
          const next = ball.trail[i + 1];
          const t = i / Math.max(1, ball.trail.length - 1);
          ctx.globalAlpha = t * 0.58;
          ctx.lineWidth = ball.r * (0.25 + t * 0.35);
          if (ball.shotKind === "rainbow") {
            ctx.strokeStyle = `hsl(${Math.floor(t * 280 + game.time * 80) % 360}, 95%, 62%)`;
          } else if (ball.shotKind === "moon") {
            ctx.strokeStyle = "#fde68a";
          } else if (ball.shotKind === "bank") {
            ctx.strokeStyle = "#93c5fd";
          } else if (ball.shotKind === "bubble") {
            ctx.strokeStyle = "#67e8f9";
          } else if (ball.shotKind === "star") {
            ctx.strokeStyle = "#fef08a";
          } else {
            ctx.strokeStyle = "#fb923c";
          }
          ctx.beginPath();
          ctx.moveTo(point.x, point.y);
          ctx.lineTo(next.x, next.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBall(ball, idleScale) {
        let stretch = clamp(Math.hypot(ball.vx, ball.vy) / 1700, 0, 0.16);
        let apexPuff = 0;
        if (ball.state === "flying" && !ball.scored) {
          apexPuff = clamp(1 - Math.abs(ball.vy) / 280, 0, 1) * 0.08;
        }
        const squeeze = ball.squeeze * 0.16;
        const sx = idleScale * (1 + stretch + squeeze - apexPuff * 0.25);
        const sy = idleScale * (1 - stretch * 0.55 - squeeze + apexPuff);
        const ballAsset = ASSET_DEFS["prop.basketball"];
        const widthScale = ballAsset ? ballAsset.logicalWidthScale : 2.28;
        const rotation = ball.state === "flying" ? ball.age * 7 + ball.x * 0.01 : game.time * 0.08;

        if (ball.shotKind === "bubble") {
          ctx.save();
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = "#67e8f9";
          ctx.lineWidth = Math.max(3, ball.r * 0.22);
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r * 1.45, 0, TAU);
          ctx.stroke();
          ctx.restore();
        } else if (ball.shotKind === "star") {
          ctx.save();
          ctx.translate(ball.x, ball.y);
          ctx.rotate(game.time * 4);
          ctx.fillStyle = "rgba(254, 240, 138, 0.62)";
          drawStar(0, 0, ball.r * 0.8, ball.r * 1.65);
          ctx.restore();
        }

        if (drawSprite("prop.basketball", ball.x, ball.y, ball.r * widthScale, {
          scaleX: sx,
          scaleY: sy,
          rotation
        })) return;

        ctx.save();
        ctx.translate(ball.x, ball.y);
        ctx.scale(sx, sy);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(0, 0, ball.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "#7c2d12";
        ctx.lineWidth = Math.max(2, ball.r * 0.12);
        ctx.beginPath();
        ctx.arc(0, 0, ball.r * 0.98, 0, TAU);
        ctx.moveTo(-ball.r, 0);
        ctx.lineTo(ball.r, 0);
        ctx.moveTo(0, -ball.r);
        ctx.lineTo(0, ball.r);
        ctx.moveTo(-ball.r * 0.72, -ball.r * 0.72);
        ctx.quadraticCurveTo(0, 0, -ball.r * 0.72, ball.r * 0.72);
        ctx.moveTo(ball.r * 0.72, -ball.r * 0.72);
        ctx.quadraticCurveTo(0, 0, ball.r * 0.72, ball.r * 0.72);
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        for (const p of game.particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          drawParticleShape(p.shape, p.size, p.color);
          ctx.restore();
        }
      }

      function drawParticleShape(shape, size, color) {
        if (shape === "star") {
          drawStar(0, 0, size * 0.65, size * 1.2);
          return;
        }
        if (shape === "leaf") {
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 0.9, size * 0.38, 0.35, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "rgba(15, 23, 42, 0.12)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-size * 0.55, 0);
          ctx.lineTo(size * 0.55, 0);
          ctx.stroke();
          return;
        }
        if (shape === "shell") {
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.78, Math.PI, TAU);
          ctx.lineTo(size * 0.78, size * 0.38);
          ctx.lineTo(-size * 0.78, size * 0.38);
          ctx.closePath();
          ctx.fill();
          return;
        }
        if (shape === "spark") {
          ctx.beginPath();
          ctx.moveTo(0, -size * 1.1);
          ctx.lineTo(size * 0.32, -size * 0.22);
          ctx.lineTo(size * 1.05, 0);
          ctx.lineTo(size * 0.25, size * 0.25);
          ctx.lineTo(0, size * 1.05);
          ctx.lineTo(-size * 0.25, size * 0.25);
          ctx.lineTo(-size * 1.05, 0);
          ctx.lineTo(-size * 0.32, -size * 0.22);
          ctx.closePath();
          ctx.fill();
          return;
        }
        if (shape === "planet") {
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.72, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1, size * 0.22);
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 1.25, size * 0.42, -0.35, 0, TAU);
          ctx.stroke();
          return;
        }
        if (shape === "stomp") {
          ctx.globalAlpha *= 0.65;
          ctx.beginPath();
          ctx.ellipse(0, 0, size * 1.25, size * 0.38, 0, 0, TAU);
          ctx.fill();
          return;
        }
        fillRoundedRect(-size * 0.5, -size * 0.25, size, size * 0.5, 2, color);
      }

      function drawStar(x, y, inner, outer) {
        ctx.beginPath();
        for (let i = 0; i < 10; i += 1) {
          const radius = i % 2 === 0 ? outer : inner;
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const px = x + Math.cos(angle) * radius;
          const py = y + Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawEgg(x, y, size, dino, crack = 0) {
        ctx.save();
        const wobble = Math.sin(game.time * 10) * crack * 0.06;
        ctx.translate(x, y);
        ctx.rotate(wobble);

        const split = clamp((crack - 0.68) / 0.32, 0, 1) * size * 0.1;
        ctx.fillStyle = dino.egg;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.18)";
        ctx.lineWidth = Math.max(2, size * 0.03);
        ctx.beginPath();
        ctx.ellipse(-split, 0, size * 0.42, size * 0.56, -0.08, Math.PI * 0.45, Math.PI * 1.55);
        ctx.ellipse(split, 0, size * 0.42, size * 0.56, 0.08, -Math.PI * 0.55, Math.PI * 0.55);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        ctx.beginPath();
        ctx.ellipse(-size * 0.12, -size * 0.14, size * 0.08, size * 0.13, -0.45, 0, TAU);
        ctx.fill();
        ctx.fillStyle = dino.body;
        for (let i = 0; i < 4; i += 1) {
          ctx.beginPath();
          ctx.ellipse(size * (-0.2 + i * 0.14), size * (0.14 - (i % 2) * 0.34), size * 0.055, size * 0.04, i * 0.4, 0, TAU);
          ctx.fill();
        }

        if (crack > 0.12) {
          ctx.strokeStyle = "rgba(15, 23, 42, 0.55)";
          ctx.lineWidth = Math.max(2, size * 0.025);
          ctx.beginPath();
          ctx.moveTo(-size * 0.2, -size * 0.08);
          ctx.lineTo(-size * 0.05, size * 0.03);
          ctx.lineTo(size * 0.05, -size * 0.03);
          ctx.lineTo(size * 0.22, size * 0.08);
          ctx.stroke();
        }
        ctx.restore();
      }

      function getPlayControls(layout) {
        const size = clamp(layout.minSide * 0.13, 52, 68);
        const y = height - layout.safe.bottom - size * 0.68;
        const controls = [
          { type: "picker", x: layout.safe.left + size * 0.74, y, r: size * 0.52, size },
          { type: "stickers", x: layout.safe.left + size * 1.95, y, r: size * 0.52, size }
        ];
        if (unlockedCourtsForScore(game.score).length > 1) {
          controls.push({ type: "court", x: width - layout.safe.right - size * 0.74, y, r: size * 0.52, size });
        }
        return controls;
      }

      function drawCourtIcon(x, y, size) {
        const court = getCurrentCourt();
        ctx.save();
        ctx.translate(x, y);
        fillRoundedRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44, size * 0.08, "#e0f2fe");
        if (court.id === "space") {
          ctx.fillStyle = "#312e81";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.44);
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.arc(size * 0.13, -size * 0.07, size * 0.06, 0, TAU);
          ctx.fill();
        } else if (court.id === "volcano") {
          ctx.fillStyle = "#7f1d1d";
          ctx.beginPath();
          ctx.moveTo(-size * 0.24, size * 0.18);
          ctx.lineTo(0, -size * 0.18);
          ctx.lineTo(size * 0.25, size * 0.18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.arc(0, -size * 0.12, size * 0.05, 0, TAU);
          ctx.fill();
        } else if (court.id === "beach") {
          ctx.fillStyle = "#38bdf8";
          ctx.fillRect(-size * 0.32, -size * 0.22, size * 0.64, size * 0.23);
          ctx.fillStyle = "#fde68a";
          ctx.fillRect(-size * 0.32, size * 0.01, size * 0.64, size * 0.21);
        } else {
          ctx.fillStyle = "#22c55e";
          ctx.beginPath();
          ctx.ellipse(0, size * 0.08, size * 0.29, size * 0.12, 0, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPlayControls(layout) {
        game.uiTargets = getPlayControls(layout);
        for (const target of game.uiTargets) {
          ctx.save();
          ctx.globalAlpha = 0.92;
          ctx.fillStyle = "rgba(255, 255, 255, 0.82)";
          ctx.beginPath();
          ctx.arc(target.x, target.y, target.r, 0, TAU);
          ctx.fill();
          ctx.strokeStyle = "rgba(15, 23, 42, 0.18)";
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();

          if (target.type === "picker") {
            drawDinoForDino(getCurrentDino(), target.x, target.y + target.size * 0.32, target.size * 0.35, "happy");
          } else if (target.type === "stickers") {
            ctx.save();
            ctx.translate(target.x, target.y);
            ctx.fillStyle = "#fef08a";
            drawStar(0, 0, target.size * 0.16, target.size * 0.36);
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
          } else {
            drawCourtIcon(target.x, target.y, target.size * 0.8);
          }
        }
      }

      function getBackButton(layout) {
        const size = clamp(layout.minSide * 0.12, 46, 62);
        return {
          type: "back",
          x: layout.safe.left + size * 0.75,
          y: layout.safe.top + size * 0.75,
          r: size * 0.5,
          size
        };
      }

      function getPickerTiles(layout) {
        const tile = clamp(layout.minSide * 0.27, 94, 142);
        const gap = clamp(layout.minSide * 0.045, 14, 24);
        const gridW = tile * 2 + gap;
        const gridH = tile * 2 + gap;
        const startX = width * 0.5 - gridW * 0.5 + tile * 0.5;
        const startY = height * 0.5 - gridH * 0.5 + tile * 0.5 + layout.safe.top * 0.2;
        return DINOS.map((dino, index) => ({
          dino,
          x: startX + (index % 2) * (tile + gap),
          y: startY + Math.floor(index / 2) * (tile + gap),
          w: tile,
          h: tile,
          locked: !game.unlockedDinos.includes(dino.id)
        }));
      }

      function drawCourtBanner(layout) {
        if (game.courtFlash <= 0) return;
        const alpha = clamp(game.courtFlash / CONFIG.COURT_FLASH_SECONDS, 0, 1);
        const h = clamp(layout.minSide * 0.11, 42, 58);
        const w = clamp(layout.minSide * 0.46, 160, 240);
        const x = width * 0.5 - w * 0.5;
        const y = layout.safe.top + clamp(layout.minSide * 0.16, 62, 86);
        ctx.save();
        ctx.globalAlpha = Math.min(0.9, alpha);
        fillRoundedRect(x, y, w, h, 18, "rgba(255, 255, 255, 0.86)");
        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${Math.floor(h * 0.48)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(getCurrentCourt().title, width * 0.5, y + h * 0.53);
        ctx.restore();
      }

      function drawScore(layout) {
        const x = layout.safe.left + 16;
        const y = layout.safe.top + 14;
        const h = clamp(layout.minSide * 0.115, 46, 58);
        const w = Math.max(104, h * 1.9);
        if (!drawSprite("ui.scoreBadge", x, y + h * 0.5, w, {
          anchorX: 0,
          anchorY: 0.5,
          logicalHeight: h
        })) {
          fillRoundedRect(x, y, w, h, 18, "rgba(255, 255, 255, 0.78)");
        }
        const iconBall = { x: x + h * 0.48, y: y + h * 0.5, r: h * 0.25, vx: 0, vy: 0, state: "ready", squeeze: 0 };
        drawBall(iconBall, 1);
        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${Math.floor(h * 0.58)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(String(game.score), x + h * 0.92, y + h * 0.52);
      }

      function drawStart(layout) {
        drawBackground(layout);
        drawHoopBack(layout);
        const titleY = layout.safe.top + clamp(height * 0.12, 70, 120);
        ctx.fillStyle = "#0f172a";
        ctx.font = `900 ${clamp(layout.minSide * 0.105, 34, 56)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Dino Basketball", width * 0.5, titleY);

        const pulse = 1 + Math.sin(game.time * 3.2) * 0.035;
        drawDino(width * 0.48, layout.groundY, clamp(layout.minSide * 0.28, 96, 140) * pulse, "happy");
        const floatingBall = {
          x: width * 0.68,
          y: layout.groundY - clamp(layout.minSide * 0.48, 150, 220) + Math.sin(game.time * 4) * 8,
          r: clamp(layout.minSide * 0.055, 19, 30),
          vx: 80,
          vy: Math.sin(game.time) * 60,
          state: "flying",
          squeeze: 0
        };
        drawBall(floatingBall, 1);
        drawHoopFront(layout);

        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${clamp(layout.minSide * 0.07, 24, 36)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.fillText("Tap to play", width * 0.5, height - clamp(height * 0.16, 78, 130));
      }

      function drawHoopSparkles(layout) {
        if (game.hoopSparkle <= 0) return;
        const hoop = layout.hoop;
        const count = 8;
        ctx.save();
        ctx.globalAlpha = clamp(game.hoopSparkle / 1.2, 0, 1);
        ctx.fillStyle = "#fef08a";
        for (let i = 0; i < count; i += 1) {
          const angle = game.time * 4 + i * TAU / count;
          const r = hoop.rimR * (1.2 + (i % 2) * 0.28);
          ctx.save();
          ctx.translate(hoop.x + Math.cos(angle) * r, hoop.y + Math.sin(angle) * r * 0.45);
          ctx.rotate(angle);
          drawStar(0, 0, 3, 7);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawCrown(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#facc15";
        ctx.strokeStyle = "#b45309";
        ctx.lineWidth = Math.max(2, size * 0.06);
        ctx.beginPath();
        ctx.moveTo(-size * 0.5, size * 0.25);
        ctx.lineTo(-size * 0.42, -size * 0.35);
        ctx.lineTo(-size * 0.15, size * 0.02);
        ctx.lineTo(0, -size * 0.45);
        ctx.lineTo(size * 0.15, size * 0.02);
        ctx.lineTo(size * 0.42, -size * 0.35);
        ctx.lineTo(size * 0.5, size * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawSurprise(layout) {
        const surprise = game.surprise;
        const celebration = game.dinoCelebration;
        if (surprise && surprise.type === "crown") {
          const bob = Math.sin(game.time * 8) * 4;
          drawCrown(layout.dino.x + layout.dino.size * 0.12, layout.dino.y - layout.dino.size * 1.2 + bob, layout.dino.size * 0.42);
        }

        if (surprise && surprise.type === "parade") {
          const progress = surprise.time / surprise.duration;
          const baseY = layout.groundY + layout.minSide * 0.06;
          for (let i = 0; i < 6; i += 1) {
            const x = ((progress * width * 1.4) + i * layout.minSide * 0.18) % (width + 80) - 40;
            const y = baseY + Math.sin(game.time * 5 + i) * 5;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = COLORS[i % COLORS.length];
            drawStar(0, 0, 5, 12);
            ctx.restore();
          }
        }

        if (celebration && celebration.type === "trex") {
          ctx.save();
          ctx.globalAlpha = 0.35 * (1 - celebration.time / celebration.duration);
          ctx.fillStyle = "#92400e";
          ctx.beginPath();
          ctx.ellipse(layout.dino.x - layout.dino.size * 0.12, layout.dino.y + 4, layout.dino.size * 0.62, layout.dino.size * 0.1, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        } else if (celebration && celebration.type === "ptero") {
          ctx.save();
          ctx.globalAlpha = 0.55 * (1 - celebration.time / celebration.duration);
          ctx.strokeStyle = "#a78bfa";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(layout.dino.x, layout.dino.y - layout.dino.size * 0.7, layout.dino.size * (0.55 + celebration.time), 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawPlay(layout) {
        drawBackground(layout);
        drawHoopBack(layout);
        drawDino(layout.dino.x, layout.dino.y, layout.dino.size, game.dinoMood);
        drawShotTrail(game.ball);
        drawBall(game.ball, 1);
        drawHoopFront(layout);
        drawHoopSparkles(layout);
        drawParticles();
        drawScore(layout);
        drawCourtBanner(layout);
        drawPlayControls(layout);
        drawSurprise(layout);
      }

      function drawHatch(layout) {
        const hatch = game.hatch || { time: 0, duration: CONFIG.HATCH_SECONDS, dinoId: game.selectedDino };
        const dino = getDinoById(hatch.dinoId);
        const tapProgress = clamp((hatch.taps || 0) / 3, 0, 1);
        const progress = Math.max(clamp(hatch.time / hatch.duration, 0, 1), tapProgress * 0.86);
        const crack = clamp((progress - 0.12) / 0.46, 0, 1);
        const reveal = clamp((progress - 0.36) / 0.34, 0, 1);
        const eggSize = clamp(layout.minSide * 0.34, 116, 176);
        const centerX = width * 0.5;
        const eggY = height * 0.51;
        const dinoSize = clamp(layout.minSide * 0.26, 92, 138);

        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.38)";
        ctx.fillRect(0, 0, width, height);
        drawParticles();

        ctx.save();
        ctx.globalAlpha = reveal;
        drawDinoForDino(dino, centerX, eggY + eggSize * 0.74 - reveal * eggSize * 0.32, dinoSize, "happy");
        ctx.restore();

        if (progress < 0.86) drawEgg(centerX, eggY + Math.sin(game.time * 8) * crack * 6, eggSize, dino, crack);

        ctx.fillStyle = "#0f172a";
        ctx.font = `900 ${clamp(layout.minSide * 0.095, 32, 54)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(reveal > 0.7 ? "New dino!" : "Tap egg!", width * 0.5, layout.safe.top + clamp(height * 0.15, 84, 130));
      }

      function drawPicker(layout) {
        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.fillRect(0, 0, width, height);

        const back = getBackButton(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.86)";
        ctx.beginPath();
        ctx.arc(back.x, back.y, back.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(4, back.size * 0.075);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(back.x + back.size * 0.13, back.y - back.size * 0.18);
        ctx.lineTo(back.x - back.size * 0.13, back.y);
        ctx.lineTo(back.x + back.size * 0.13, back.y + back.size * 0.18);
        ctx.stroke();

        game.pickerTargets = getPickerTiles(layout);
        for (const tile of game.pickerTargets) {
          const selected = tile.dino.id === game.selectedDino;
          const bounce = tile.locked && game.pickerBounce > 0 ? Math.sin(game.pickerBounce * 44) * 4 : 0;
          const x = tile.x - tile.w * 0.5;
          const y = tile.y - tile.h * 0.5 + bounce;
          fillRoundedRect(x, y, tile.w, tile.h, 18, selected ? "rgba(254, 240, 138, 0.92)" : "rgba(255, 255, 255, 0.84)");
          ctx.strokeStyle = selected ? "#f97316" : "rgba(15, 23, 42, 0.18)";
          ctx.lineWidth = selected ? 5 : 3;
          roundedRect(x, y, tile.w, tile.h, 18);
          ctx.stroke();

          if (tile.locked) {
            drawEgg(tile.x, tile.y + tile.h * 0.02 + bounce, tile.w * 0.54, tile.dino, 0);
          } else {
            drawDinoForDino(tile.dino, tile.x, tile.y + tile.h * 0.38 + bounce, tile.w * 0.42, "happy");
          }
        }
      }

      function drawStickerBook(layout) {
        drawBackground(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
        ctx.fillRect(0, 0, width, height);

        const back = getBackButton(layout);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(back.x, back.y, back.r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = Math.max(4, back.size * 0.075);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(back.x + back.size * 0.13, back.y - back.size * 0.18);
        ctx.lineTo(back.x - back.size * 0.13, back.y);
        ctx.lineTo(back.x + back.size * 0.13, back.y + back.size * 0.18);
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = `900 ${clamp(layout.minSide * 0.085, 28, 44)}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Stickers", width * 0.5, layout.safe.top + clamp(layout.minSide * 0.15, 58, 84));

        const tile = clamp(layout.minSide * 0.19, 72, 108);
        const gap = clamp(layout.minSide * 0.035, 12, 18);
        const columns = 4;
        const gridW = columns * tile + (columns - 1) * gap;
        const startX = width * 0.5 - gridW * 0.5 + tile * 0.5;
        const startY = height * 0.34;
        const earnedCourts = unlockedCourtsForScore(game.score);

        DINOS.forEach((dino, index) => {
          const x = startX + index * (tile + gap);
          const y = startY;
          const earned = game.unlockedDinos.includes(dino.id);
          drawStickerTile(x, y, tile, earned);
          if (earned) drawDinoForDino(dino, x, y + tile * 0.34, tile * 0.36, "happy");
          else drawEgg(x, y + tile * 0.04, tile * 0.45, dino, 0);
        });

        COURTS.forEach((court, index) => {
          const x = startX + index * (tile + gap);
          const y = startY + tile + gap;
          const earned = earnedCourts.includes(court.id);
          drawStickerTile(x, y, tile, earned);
          ctx.save();
          ctx.globalAlpha = earned ? 1 : 0.32;
          const oldCourt = game.court;
          game.court = court.id;
          drawCourtIcon(x, y, tile * 0.78);
          game.court = oldCourt;
          ctx.restore();
        });
      }

      function drawStickerTile(x, y, size, earned) {
        const left = x - size * 0.5;
        const top = y - size * 0.5;
        fillRoundedRect(left, top, size, size, 16, earned ? "rgba(255, 255, 255, 0.88)" : "rgba(255, 255, 255, 0.55)");
        ctx.strokeStyle = earned ? "#facc15" : "rgba(15, 23, 42, 0.18)";
        ctx.lineWidth = earned ? 4 : 3;
        roundedRect(left, top, size, size, 16);
        ctx.stroke();
        if (!earned) {
          ctx.save();
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = "#0f172a";
          drawStar(x, y, size * 0.16, size * 0.34);
          ctx.restore();
        }
      }

      function draw() {
        const layout = getLayout();
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);

        if (game.shakeLeft > 0) {
          const t = game.shakeLeft / (CONFIG.SHAKE_MS / 1000);
          const amount = CONFIG.SHAKE_INTENSITY * t * t;
          ctx.translate(rand(-amount, amount), rand(-amount, amount));
        }

        if (game.state === STATE.START) drawStart(layout);
        else if (game.state === STATE.HATCH) drawHatch(layout);
        else if (game.state === STATE.PICKER) drawPicker(layout);
        else if (game.state === STATE.STICKERS) drawStickerBook(layout);
        else drawPlay(layout);

        ctx.restore();
      }

      function getTapPoint(event) {
        const touch = event && event.changedTouches && event.changedTouches[0];
        const source = touch || event || { clientX: width * 0.5, clientY: height * 0.5 };
        return {
          x: source.clientX,
          y: source.clientY
        };
      }

      function hitCircle(point, target, pad = 0) {
        return Math.hypot(point.x - target.x, point.y - target.y) <= target.r + pad;
      }

      function hitRect(point, tile) {
        return point.x >= tile.x - tile.w * 0.5 &&
          point.x <= tile.x + tile.w * 0.5 &&
          point.y >= tile.y - tile.h * 0.5 &&
          point.y <= tile.y + tile.h * 0.5;
      }

      function handlePlayControlTap(point) {
        const layout = getLayout();
        for (const target of getPlayControls(layout)) {
          if (!hitCircle(point, target, 12)) continue;

          if (target.type === "picker") {
            game.state = STATE.PICKER;
            game.queuedShot = false;
            game.autoLaunchDelay = 0;
            playTap();
            return true;
          }

          if (target.type === "stickers") {
            game.state = STATE.STICKERS;
            game.queuedShot = false;
            game.autoLaunchDelay = 0;
            playTap();
            return true;
          }

          if (target.type === "court") {
            cycleCourt();
            playTap();
            return true;
          }
        }
        return false;
      }

      function handlePickerTap(point) {
        const layout = getLayout();
        const back = getBackButton(layout);
        if (hitCircle(point, back, 10)) {
          game.state = STATE.PLAY;
          playTap();
          resetReadyBall();
          return;
        }

        for (const tile of getPickerTiles(layout)) {
          if (!hitRect(point, tile)) continue;
          if (tile.locked) {
            game.pickerBounce = 0.3;
            playMiss();
            return;
          }

          game.selectedDino = tile.dino.id;
          game.state = STATE.PLAY;
          game.dinoReact = 0.46;
          game.dinoMood = "happy";
          saveGame();
          playTap();
          resetReadyBall();
          return;
        }
      }

      function handleBackOnlyTap(point) {
        const layout = getLayout();
        const back = getBackButton(layout);
        if (hitCircle(point, back, 10)) {
          game.state = STATE.PLAY;
          playTap();
          resetReadyBall();
        }
      }

      function handleHatchTap(point) {
        if (!game.hatch) return;
        game.hatch.taps += 1;
        const dino = getDinoById(game.hatch.dinoId);
        const layout = getLayout();
        const crackProgress = clamp(game.hatch.taps / 3, 0, 1);
        spawnParticles(width * 0.5, height * 0.5, 12 + game.hatch.taps * 4, dino.particles, "star");
        game.hatch.time = Math.max(game.hatch.time, game.hatch.duration * (0.18 + crackProgress * 0.58));
        playTap();
        if (game.hatch.taps >= 3 && game.hatch.time > game.hatch.duration * 0.72) {
          spawnParticles(layout.dino.x, height * 0.45, CONFIG.PARTICLE_COUNT, dino.particles, "star");
        }
      }

      function handleTap(event) {
        if (event) event.preventDefault();
        const point = getTapPoint(event);
        const now = performance.now();
        if (now - lastTapAt < 90) return;
        lastTapAt = now;

        ensureAudio();
        if (game.state === STATE.START) {
          game.state = STATE.PLAY;
          game.dinoReact = 0.4;
          game.dinoMood = "happy";
          playTap();
          resetReadyBall();
          return;
        }

        if (game.state === STATE.HATCH) {
          handleHatchTap(point);
          if (game.hatch && game.hatch.taps >= 3 && game.hatch.time > game.hatch.duration * 0.82) endHatch();
          return;
        }

        if (game.state === STATE.PICKER) {
          handlePickerTap(point);
          return;
        }

        if (game.state === STATE.STICKERS) {
          handleBackOnlyTap(point);
          return;
        }

        if (handlePlayControlTap(point)) return;
        launchShot();
      }

      function preventGesture(event) {
        event.preventDefault();
      }

      canvas.addEventListener("touchend", handleTap, { passive: false });
      canvas.addEventListener("pointerup", (event) => {
        if (event.pointerType !== "touch") handleTap(event);
      }, { passive: false });
      canvas.addEventListener("touchstart", preventGesture, { passive: false });
      canvas.addEventListener("touchmove", preventGesture, { passive: false });
      canvas.addEventListener("contextmenu", preventGesture);
      document.addEventListener("gesturestart", preventGesture, { passive: false });
      document.addEventListener("gesturechange", preventGesture, { passive: false });
      document.addEventListener("gestureend", preventGesture, { passive: false });
      document.addEventListener("touchmove", preventGesture, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener("touchend", (event) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      function loop(now) {
        const dt = clamp((now - lastTime) / 1000, 0, 0.033);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeCanvas);
      }

      resizeCanvas();
      loadAssets();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
